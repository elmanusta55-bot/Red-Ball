<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">

    <title>Red Ball Pro</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #87CEEB;
            font-family: Arial, sans-serif;
            user-select: none;
        }

        canvas {
            display: block;
            background: linear-gradient(#87CEEB, #E0F7FA);
        }

        .hud {
            position: fixed;
            top: 12px;
            left: 12px;
            right: 12px;
            z-index: 20;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #fff;
            font-weight: bold;
            text-shadow: 0 2px 3px rgba(0, 0, 0, 0.5);
            pointer-events: none;
            font-size: 20px;
        }

        .hud-right {
            text-align: right;
            line-height: 1.4;
        }

        .top-actions {
            position: fixed;
            top: 12px;
            right: 12px;
            z-index: 35;
            display: flex;
            gap: 8px;
            pointer-events: auto;
        }

        .icon-btn {
            border: none;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.4);
            color: #fff;
            font-size: 24px;
            padding: 8px 12px;
            cursor: pointer;
        }

        .power-indicator {
            position: fixed;
            top: 62px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 35;
            color: #fff;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 999px;
            padding: 7px 14px;
            font-weight: bold;
            text-shadow: 0 2px 2px rgba(0, 0, 0, 0.5);
            display: none;
        }

        .ui-overlay {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            z-index: 30;
        }

        .move-btns {
            display: flex;
            gap: 15px;
            pointer-events: auto;
        }

        .action-btns {
            pointer-events: auto;
        }

        .btn {
            width: 70px;
            height: 70px;
            background: rgba(255, 255, 255, 0.3);
            border: 3px solid white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            color: white;
            touch-action: none;
        }

        .btn:active {
            background: rgba(255, 255, 255, 0.6);
            transform: scale(0.9);
        }

        .jump-btn {
            width: 90px;
            height: 90px;
            background: rgba(255, 0, 0, 0.4);
        }

        .overlay-screen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 12px;
            background: rgba(0, 0, 0, 0.48);
            color: #fff;
            z-index: 40;
            text-align: center;
            padding: 20px;
        }

        .overlay-screen.hidden {

        }

        .overlay-title {
            font-size: 52px;
            margin: 0;
            text-shadow: 0 3px 6px rgba(0, 0, 0, 0.5);
        }

            margin: 0 0 6px;
            font-size: 22px;

            border: none;
            border-radius: 10px;
            background: #ff3d00;
            color: #fff;

    function ensureAudio() {
        if (!soundState.enabled || soundState.ready) return;

        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;

        soundState.ctx = new AudioContextClass();
        soundState.masterGain = soundState.ctx.createGain();
        soundState.masterGain.gain.value = 0.22;
        soundState.masterGain.connect(soundState.ctx.destination);

        soundState.bgGain = soundState.ctx.createGain();
        soundState.bgGain.gain.value = 0.08;
        soundState.bgGain.connect(soundState.masterGain);

        soundState.bgOsc = soundState.ctx.createOscillator();
        soundState.bgOsc.type = "sine";
        soundState.bgOsc.frequency.value = 160;

        soundState.bgLfo = soundState.ctx.createOscillator();
        soundState.bgLfo.type = "sine";
        soundState.bgLfo.frequency.value = 0.22;
        soundState.bgLfoGain = soundState.ctx.createGain();
        soundState.bgLfoGain.gain.value = 22;

        soundState.bgLfo.connect(soundState.bgLfoGain);
        soundState.bgLfoGain.connect(soundState.bgOsc.frequency);
        soundState.bgOsc.connect(soundState.bgGain);

        soundState.bgOsc.start();
        soundState.bgLfo.start();
        soundState.ready = true;
    }

    function syncSoundUi() {
        soundBtn.textContent = soundState.enabled ? "🔊" : "🔇";
    }

    function setSoundEnabled(enabled) {
        soundState.enabled = enabled;
        localStorage.setItem(SOUND_KEY, enabled ? "1" : "0");
        syncSoundUi();

        if (enabled) {
            ensureAudio();
            if (soundState.ctx && soundState.ctx.state === "suspended") {
                soundState.ctx.resume();
            }
        } else if (soundState.ctx && soundState.ctx.state === "running") {
            soundState.ctx.suspend();
        }
    }

    function playTone(type, frequency, duration = 0.12, volume = 0.2, glideTo = null) {
        if (!soundState.enabled) return;
        ensureAudio();
        if (!soundState.ctx || !soundState.masterGain) return;

        const now = soundState.ctx.currentTime;
        const osc = soundState.ctx.createOscillator();
        const gain = soundState.ctx.createGain();

        osc.type = type;
        osc.frequency.setValueAtTime(frequency, now);
        if (glideTo) {
            osc.frequency.linearRampToValueAtTime(glideTo, now + duration);
        }

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.exponentialRampToValueAtTime(Math.max(0.001, volume), now + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

        osc.connect(gain);
        gain.connect(soundState.masterGain);
        osc.start(now);
        osc.stop(now + duration + 0.02);
    }

    function playJumpSound() {

    function updateHighScore() {
        if (score > highScore) {

            localStorage.setItem(HIGH_SCORE_KEY, String(highScore));

    function saveLeaderboard() {
        localStorage.setItem(LEADERBOARD_KEY, JSON.stringify(leaderboard));
    }

    function pushLeaderboard(value) {
        leaderboard.push(value);
        leaderboard.sort((a, b) => b - a);
        leaderboard = leaderboard.slice(0, 5);
        saveLeaderboard();
        refreshMenuMeta();
    }

    function refreshMenuMeta() {
        menuBest.textContent = `Rekord: ${highScore}`;

        leaderboardList.innerHTML = "";
        if (!leaderboard.length) {
            const li = document.createElement("li");
            li.textContent = "Hələ nəticə yoxdur";
            leaderboardList.appendChild(li);
            return;
        }

        leaderboard.forEach((value, index) => {
            const li = document.createElement("li");
            li.textContent = `${index + 1}. ${value} xal`;
            leaderboardList.appendChild(li);
        });
    }

    function applySkin(skinName) {
        const color = SKINS[skinName] || SKINS.red;
        player.baseColor = color;
        if (!isAnyPowerActive()) {
            player.color = color;
        }
        localStorage.setItem(SKIN_KEY, skinName);

        document.querySelectorAll(".skin-btn").forEach((btn) => {
            btn.classList.toggle("selected", btn.dataset.skin === skinName);
        });
    }

    function updateHud() {
        scoreText.textContent = `Xal: ${score} | Rekord: ${highScore}`;
        livesText.textContent = `Can: ${"❤️".repeat(Math.max(0, lives))}`;
        levelText.textContent = `${level ? level.name : "Səviyyə"}`;
    }

    function showMenu() {
        state = GAME_STATE.MENU;
        menuScreen.classList.remove("hidden");
        messageScreen.classList.add("hidden");
        refreshMenuMeta();
    }

    function showMessage(title, subtitle, primaryText, primaryAction, secondaryText = "Baş Menyu", secondaryAction = showMenu) {
        messageTitle.textContent = title;
        messageSubtitle.textContent = subtitle;
        messagePrimaryBtn.textContent = primaryText;
        messagePrimaryBtn.onclick = primaryAction;

        if (secondaryText) {
            messageSecondaryBtn.textContent = secondaryText;
            messageSecondaryBtn.style.display = "inline-block";
            messageSecondaryBtn.onclick = secondaryAction;
        } else {
            messageSecondaryBtn.style.display = "none";
        }

        menuScreen.classList.add("hidden");
        messageScreen.classList.remove("hidden");
    }

    function hideOverlays() {
        menuScreen.classList.add("hidden");
        messageScreen.classList.add("hidden");
    }

    function isAnyPowerActive() {
        return powerState.star > 0 || powerState.speed > 0 || powerState.magnet > 0;
    }

    function resetPowers() {
        powerState.star = 0;
        powerState.speed = 0;
        powerState.magnet = 0;
        player.color = player.baseColor;
        powerIndicator.style.display = "none";
    }

    function refreshPowerColorAndUi() {
        if (powerState.star > 0) {
            player.color = "#FFEB3B";
            powerIndicator.style.display = "block";
            powerIndicator.textContent = `⭐ Ulduz: ${(powerState.star / 60).toFixed(1)}s`;
            return;
        }

        if (powerState.speed > 0) {
            player.color = "#42A5F5";
            powerIndicator.style.display = "block";
            powerIndicator.textContent = `💨 Sürət: ${(powerState.speed / 60).toFixed(1)}s`;
            return;
        }

        if (powerState.magnet > 0) {
            player.color = "#AB47BC";
            powerIndicator.style.display = "block";
            powerIndicator.textContent = `🧲 Maqnit: ${(powerState.magnet / 60).toFixed(1)}s`;
            return;
        }

        player.color = player.baseColor;
        powerIndicator.style.display = "none";
    }

    // Səviyyəni yüklə
    function loadLevel(index) {
        currentLevelIndex = index;
        level = levels[currentLevelIndex];
        platforms = cloneRects(level.platforms).map((p) => ({
            ...p,
            baseX: p.x,
            baseY: p.y,
            phase: Math.random() * Math.PI * 2,
            dx: 0,
            dy: 0,
            falling: false,
            fallVy: 0,
            breaking: false,
            breakTimer: 0,
            broken: false,
            shake: 0
        }));
        hazards = cloneRects(level.hazards);
        coins = level.coins.map((coin) => ({ ...coin, alpha: coin.hidden ? 0 : 1, revealed: !coin.hidden }));
        enemies = level.enemies.map((enemy) => ({ ...enemy }));
        powerUps = level.powerUps.map((p) => ({ ...p }));
        exitDoor = { ...level.exitDoor };

        player.x = level.spawn.x;
        player.y = level.spawn.y;
        player.vx = 0;
        player.vy = 0;
        player.grounded = false;
        player.prevGrounded = false;
        player.onPlatform = null;
        player.squashX = 1;
        player.squashY = 1;

        resetPowers();

        cameraX = 0;
        updateHud();
    }

    function startGame() {
        score = 0;
        lives = 3;
        levels = buildLevels();
        loadLevel(0);
        hideOverlays();
        state = GAME_STATE.PLAYING;
        ensureAudio();
    }

    function rebuildLevelAfterResize() {
        if (!canvas.width || !canvas.height) {
            return;
        }

        const oldScore = score;
        const oldLives = lives;
        const oldIndex = currentLevelIndex;
        const oldState = state;

        levels = buildLevels();
        score = oldScore;
        lives = oldLives;

        if (oldState !== GAME_STATE.MENU) {
            loadLevel(Math.min(oldIndex, levels.length - 1));
        }

        state = oldState;
        updateHud();
    }

    function addParticles(x, y, count, color, speedMin = 1, speedMax = 3, lifeMin = 18, lifeMax = 35) {
        for (let i = 0; i < count; i += 1) {
            const angle = Math.random() * Math.PI * 2;
            const speed = speedMin + Math.random() * (speedMax - speedMin);
            particles.push({
                x,
                y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                life: lifeMin + Math.random() * (lifeMax - lifeMin),
                maxLife: lifeMax,
                r: 2 + Math.random() * 2,
                color
            });
        }
    }

    function addFloatingText(x, y, text, color = "#fff") {
        floatingTexts.push({ x, y, text, color, life: 45 });
    }

    function addScore(points, x = player.x, y = player.y - 30) {
        score += points;
        updateHighScore();
        addFloatingText(x, y, `+${points}`, "#FFEB3B");
        updateHud();
    }

    function triggerDamageEffect() {
        shakeTimer = 16;
        shakeAmount = 10;
        redFlashTimer = 14;
    }

    function loseLife() {
        if (state !== GAME_STATE.PLAYING || powerState.star > 0) {
            return;
        }

        playHitSound();
        triggerDamageEffect();
        lives -= 1;
        updateHud();

        if (lives <= 0) {
            updateHighScore();
            pushLeaderboard(score);
            state = GAME_STATE.GAME_OVER;
            showMessage(
                "Game Over",
                `Cari xal: ${score} | Rekord: ${highScore}`,
                "Yenidən Oyna",
                () => startGame(),
                "Baş Menyu",
                () => showMenu()
            );
            return;
        }

        // Can qaldıqda eyni səviyyənin başlanğıcına qaytar
        player.x = level.spawn.x;
        player.y = level.spawn.y;
        player.vx = 0;
        player.vy = 0;
        player.grounded = false;
        player.prevGrounded = false;
        player.onPlatform = null;
        cameraX = Math.max(0, player.x - canvas.width / 2);
    }

    function checkAABBCircle(cx, cy, cr, rect) {
        const nearestX = Math.max(rect.x, Math.min(cx, rect.x + rect.w));
        const nearestY = Math.max(rect.y, Math.min(cy, rect.y + rect.h));
        const dx = cx - nearestX;
        const dy = cy - nearestY;
        return dx * dx + dy * dy <= cr * cr;
    }

    function updatePlatforms() {
        const time = performance.now() / 1000;

        platforms.forEach((p) => {
            p.dx = 0;
            p.dy = 0;

            if (p.type === "moving") {
                const oldX = p.x;
                const oldY = p.y;
                if (p.axis === "x") {
                    p.x = p.baseX + Math.sin(time * p.speed + p.phase) * p.range;
                } else {
                    p.y = p.baseY + Math.sin(time * p.speed + p.phase) * p.range;
                }
                p.dx = p.x - oldX;
                p.dy = p.y - oldY;
            }

            if (p.type === "breakable") {
                if (p.breaking && !p.broken) {
                    p.breakTimer -= 1;
                    p.shake = Math.sin(time * 40) * 2;
                    if (p.breakTimer <= 0) {
                        p.broken = true;
                        p.falling = true;
                        p.shake = 0;
                    }
                }

                if (p.falling) {
                    p.fallVy += 0.55;
                    p.y += p.fallVy;
                    p.dy += p.fallVy;
                }
            }
        });
    }

    function updatePlayerPhysics() {
        const speedMultiplier = powerState.speed > 0 ? 2 : 1;
        const targetSpeed = player.speed * speedMultiplier;

        if (inputs.left) player.vx = -targetSpeed;
        else if (inputs.right) player.vx = targetSpeed;
        else {
            const onIce = player.onPlatform && player.onPlatform.type === "ice";
            player.vx *= onIce ? 0.96 : 0.82;
        }

        if (player.onPlatform && (player.onPlatform.dx || player.onPlatform.dy)) {
            player.x += player.onPlatform.dx;
            player.y += player.onPlatform.dy;
        }

        const prevVy = player.vy;
        const prevBottom = player.y + player.radius;

        player.vy += player.gravity;
        player.x += player.vx;
        player.y += player.vy;

        player.grounded = false;
        player.onPlatform = null;

        // Platforma üst səth toqquşması
        platforms.forEach((p) => {
            if (p.type === "breakable" && p.broken) return;

            const px = p.x + (p.shake || 0);
            const inHorizontalRange = player.x + player.radius > px && player.x - player.radius < px + p.w;
            const currentBottom = player.y + player.radius;
            if (inHorizontalRange && prevBottom <= p.y && currentBottom >= p.y) {
                player.y = p.y - player.radius;

                if (p.type === "bounce") {
                    player.vy = player.jumpPower * 1.25;
                    playJumpSound();
                } else {
                    player.vy = 0;
                    player.grounded = true;
                    player.onPlatform = p;
                }

                if (p.type === "breakable" && !p.breaking) {
                    p.breaking = true;
                    p.breakTimer = 60;
                }
            }
        });

        // Dünya sərhədləri
        player.x = Math.max(player.radius, Math.min(level.worldWidth - player.radius, player.x));

        // Boşluğa düşərsə can itir
        if (player.y - player.radius > canvas.height + 280) {
            loseLife();
        }

        // Top üçün squash/stretch animasiyası
        if (player.grounded && !player.prevGrounded && Math.abs(prevVy) > 2) {
            player.squashX = 1.22;
            player.squashY = 0.82;
            addParticles(player.x, player.y + player.radius - 2, 8, "rgba(240,240,240,0.9)", 0.5, 2, 15, 28);
        } else if (!player.grounded && player.vy < -2) {
            player.squashX = 0.9;
            player.squashY = 1.14;
        }
        player.squashX += (1 - player.squashX) * 0.24;
        player.squashY += (1 - player.squashY) * 0.24;
        player.prevGrounded = player.grounded;
    }

    function updatePowerTimers() {
        powerState.star = Math.max(0, powerState.star - 1);
        powerState.speed = Math.max(0, powerState.speed - 1);
        powerState.magnet = Math.max(0, powerState.magnet - 1);
        refreshPowerColorAndUi();
    }

    function updateCoins() {
        coins.forEach((coin) => {
            if (coin.collected) return;

            const dx = player.x - coin.x;
            const dy = player.y - coin.y;
            const dist = Math.hypot(dx, dy);

            if (coin.hidden && !coin.revealed && dist <= (coin.revealDistance || 170)) {
                coin.revealed = true;
            }

            if (powerState.magnet > 0 && dist < 220) {
                const pull = 0.12;
                coin.x += dx * pull;
                coin.y += dy * pull;
            }

            const r = player.radius + coin.r;
            if (dist <= r) {
                coin.collected = true;
                addScore(10, coin.x, coin.y - 15);
                playCoinSound();
            }
        });
    }

    function updatePowerUps() {
        powerUps.forEach((p) => {
            if (p.collected) return;
            const dist = Math.hypot(player.x - p.x, player.y - p.y);
            if (dist <= player.radius + p.r) {
                p.collected = true;
                if (p.type === "star") powerState.star = 5 * 60;
                if (p.type === "speed") powerState.speed = 4 * 60;
                if (p.type === "magnet") powerState.magnet = 5 * 60;
                refreshPowerColorAndUi();
                playTone("triangle", 520, 0.15, 0.18, 760);
            }
        });
    }

    function updateHazards() {
        for (const hazard of hazards) {
            const hazardRect = {
                x: hazard.x,
                y: hazard.y - hazard.h,
                w: hazard.w,
                h: hazard.h
            };
            if (checkAABBCircle(player.x, player.y, player.radius, hazardRect)) {
                loseLife();
                break;
            }
        }
    }

    function destroyEnemy(enemy) {
        enemy.alive = false;
        player.vy = player.jumpPower * 0.62;
        addScore(25, enemy.x, enemy.y - 10);
        addParticles(enemy.x, enemy.y, 14, "rgba(255,140,0,0.9)", 1.2, 3.5, 18, 36);
        playEnemyDestroySound();
    }

    function updateEnemies() {
        for (const enemy of enemies) {
            if (!enemy.alive) continue;

            enemy.x += enemy.vx;
            if (enemy.x - enemy.r <= enemy.minX || enemy.x + enemy.r >= enemy.maxX) {
                enemy.vx *= -1;
            }

            const dx = player.x - enemy.x;
            const dy = player.y - enemy.y;
            const distance = Math.hypot(dx, dy);

            if (distance <= player.radius + enemy.r) {
                const stompFromTop = player.vy > 1 && player.y < enemy.y - enemy.r * 0.2;
                if (stompFromTop || powerState.star > 0) {
                    destroyEnemy(enemy);
                } else {
                    loseLife();
                    break;
                }
            }
        }
    }

    function updateExitDoor() {
        if (!exitDoor) return;

        const insideDoor =
            player.x + player.radius > exitDoor.x &&
            player.x - player.radius < exitDoor.x + exitDoor.w &&
            player.y + player.radius > exitDoor.y &&
            player.y - player.radius < exitDoor.y + exitDoor.h;

        if (insideDoor && state === GAME_STATE.PLAYING) {
            state = GAME_STATE.LEVEL_COMPLETE;
            showMessage(
                "Səviyyə tamamlandı",
                `${level.name} bitdi!`,
                "Növbəti Səviyyə",
                () => {
                    if (currentLevelIndex < levels.length - 1) {
                        loadLevel(currentLevelIndex + 1);
                        hideOverlays();
                        state = GAME_STATE.PLAYING;
                    } else {
                        updateHighScore();
                        pushLeaderboard(score);
                        state = GAME_STATE.VICTORY;
                        showMessage(
                            "Təbriklər!",
                            `Cari xal: ${score} | Rekord: ${highScore}`,
                            "Yenidən Oyna",
                            () => startGame(),
                            "Baş Menyu",
                            () => showMenu()
                        );
                    }
                },
                "Baş Menyu",
                () => showMenu()
            );
        }
    }

    function updateEffects() {
        particles = particles.filter((p) => {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.04;
            p.life -= 1;
            return p.life > 0;
        });

        floatingTexts = floatingTexts.filter((t) => {
            t.y -= 0.7;
            t.life -= 1;
            return t.life > 0;
        });

        if (shakeTimer > 0) {
            shakeTimer -= 1;
            if (shakeTimer === 0) shakeAmount = 0;
        }

        if (redFlashTimer > 0) {
            redFlashTimer -= 1;
        }
    }

    function togglePause() {
        if (state === GAME_STATE.PLAYING) {
            state = GAME_STATE.PAUSED;
            showMessage("Fasilə", "Oyun dayandırıldı", "Davam et", () => {
                hideOverlays();
                state = GAME_STATE.PLAYING;
            }, "Baş Menyu", () => showMenu());
        } else if (state === GAME_STATE.PAUSED) {
            hideOverlays();
            state = GAME_STATE.PLAYING;
        }
    }

    function update() {
        if (state === GAME_STATE.PLAYING) {
            if (inputs.jump && player.grounded) {
                player.vy = player.jumpPower;
                player.grounded = false;
                addParticles(player.x, player.y + player.radius - 2, 8, "rgba(255,255,255,0.9)", 0.8, 2.2, 16, 28);
                playJumpSound();
            }

            updatePlatforms();
            updatePlayerPhysics();
            updatePowerUps();
            updatePowerTimers();
            updateCoins();
            updateHazards();
            updateEnemies();
            updateExitDoor();

            cameraX = Math.max(0, Math.min(level.worldWidth - canvas.width, player.x - canvas.width / 2));
        }

        updateEffects();
        draw();
        requestAnimationFrame(update);
    }

    function drawCloud(cloudX, cloudY, radius, color) {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(cloudX, cloudY, radius, 0, Math.PI * 2);
        ctx.arc(cloudX + radius * 0.9, cloudY + 2, radius * 0.8, 0, Math.PI * 2);
        ctx.arc(cloudX - radius * 0.9, cloudY + 4, radius * 0.72, 0, Math.PI * 2);
        ctx.fill();
    }

    function drawMountain(x, width, height) {
        const baseY = canvas.height - 50;
        ctx.beginPath();
        ctx.moveTo(x, baseY);
        ctx.lineTo(x + width / 2, baseY - height);
        ctx.lineTo(x + width, baseY);
        ctx.closePath();
        ctx.fill();
    }

    function currentTheme() {
        if (!level) return LEVEL_THEMES[0];
        const i = Math.min(LEVEL_THEMES.length - 1, currentLevelIndex);
        return LEVEL_THEMES[i];
    }

    function drawParallaxBackground() {
        const theme = currentTheme();
        const bg = ctx.createLinearGradient(0, 0, 0, canvas.height);
        bg.addColorStop(0, theme.skyTop);
        bg.addColorStop(1, theme.skyBottom);
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Arxa qat: buludlar (daha yavaş)
        const cloudParallax = 0.25;
        level.clouds.forEach((cloud) => {
            const x = cloud.x - cameraX * cloudParallax;
            drawCloud(x, cloud.y, cloud.r, theme.cloud);
        });

        // Orta qat: dağlar (orta sürət)
        const mountainParallax = 0.5;
        ctx.fillStyle = theme.mountain;
        level.mountains.forEach((mountain) => {
            const x = mountain.x - cameraX * mountainParallax;
            drawMountain(x, mountain.w, mountain.h);
        });
    }

    function drawCoins() {
        coins.forEach((coin) => {
            if (coin.collected) return;
            if (coin.hidden && !coin.revealed) return;

            ctx.beginPath();
            ctx.arc(coin.x, coin.y, coin.r, 0, Math.PI * 2);
            ctx.fillStyle = "#FFD700";
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = "#B8860B";
            ctx.stroke();
        });
    }

    function drawPowerUps() {
        powerUps.forEach((p) => {
            if (p.collected) return;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);

            if (p.type === "star") {
                ctx.fillStyle = "#FFEB3B";
            } else if (p.type === "speed") {
                ctx.fillStyle = "#42A5F5";
            } else {
                ctx.fillStyle = "#AB47BC";
            }
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = "rgba(0,0,0,0.35)";
            ctx.stroke();
        });
    }

    function drawHazards() {
        ctx.fillStyle = "#37474F";
        hazards.forEach((h) => {
            ctx.beginPath();
            ctx.moveTo(h.x, h.y);
            ctx.lineTo(h.x + h.w / 2, h.y - h.h);
            ctx.lineTo(h.x + h.w, h.y);
            ctx.fill();
        });
    }

    function drawEnemies() {
        enemies.forEach((enemy) => {
            if (!enemy.alive) return;
            ctx.beginPath();
            ctx.arc(enemy.x, enemy.y, enemy.r, 0, Math.PI * 2);
            ctx.fillStyle = "#111";
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = "#333";
            ctx.stroke();
        });
    }

    function drawDoor() {
        if (!exitDoor) return;
        ctx.fillStyle = "#00BCD4";
        ctx.fillRect(exitDoor.x, exitDoor.y, exitDoor.w, exitDoor.h);
        ctx.fillStyle = "#B2EBF2";
        ctx.fillRect(exitDoor.x + 8, exitDoor.y + 8, exitDoor.w - 16, exitDoor.h - 16);

        ctx.fillStyle = "#795548";
        ctx.fillRect(exitDoor.x + exitDoor.w + 10, exitDoor.y - 70, 6, 70);
        ctx.fillStyle = "#FFEB3B";
        ctx.beginPath();
        ctx.moveTo(exitDoor.x + exitDoor.w + 16, exitDoor.y - 70);
        ctx.lineTo(exitDoor.x + exitDoor.w + 55, exitDoor.y - 52);
        ctx.lineTo(exitDoor.x + exitDoor.w + 16, exitDoor.y - 35);
        ctx.closePath();
        ctx.fill();
    }

    function drawPlatforms() {
        platforms.forEach((p) => {
            if (p.type === "breakable" && p.broken) return;

            if (p.type === "bounce") {
                ctx.fillStyle = "#FFB74D";
            } else if (p.type === "ice") {
                ctx.fillStyle = "#81D4FA";
            } else if (p.type === "breakable") {
                ctx.fillStyle = p.breaking ? "#EF5350" : "#8D6E63";
            } else if (p.type === "moving") {
                ctx.fillStyle = "#66BB6A";
            } else {
                ctx.fillStyle = "#4CAF50";
            }

            const drawX = p.x + (p.shake || 0);
            ctx.fillRect(drawX, p.y, p.w, p.h);

            ctx.fillStyle = "rgba(0,0,0,0.18)";
            ctx.fillRect(drawX, p.y, p.w, 4);
        });
    }

    function drawPlayer() {
        ctx.save();
        ctx.translate(player.x, player.y);
        ctx.scale(player.squashX, player.squashY);

        ctx.beginPath();
        ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
        ctx.fillStyle = player.color;
        ctx.fill();
        ctx.strokeStyle = "black";
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = "white";
        ctx.beginPath();
        ctx.arc(8, -5, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "black";
        ctx.beginPath();
        ctx.arc(10, -5, 2, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }

    function drawParticles() {
        particles.forEach((p) => {
            const alpha = Math.max(0, p.life / p.maxLife);
            ctx.globalAlpha = alpha;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fill();
        });
        ctx.globalAlpha = 1;
    }

    function drawFloatingTexts() {
        floatingTexts.forEach((t) => {
            ctx.globalAlpha = Math.max(0, t.life / 45);
            ctx.fillStyle = t.color;
            ctx.font = "bold 20px Arial";
            ctx.fillText(t.text, t.x, t.y);
        });
        ctx.globalAlpha = 1;
    }

    function drawDamageOverlay() {
        if (redFlashTimer <= 0) return;
        const alpha = redFlashTimer / 20;
        ctx.fillStyle = `rgba(255, 0, 0, ${Math.min(0.34, alpha * 0.35)})`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (!level) return;

        let shakeX = 0;
        let shakeY = 0;
        if (shakeTimer > 0) {
            shakeX = (Math.random() - 0.5) * shakeAmount;
            shakeY = (Math.random() - 0.5) * shakeAmount;
        }

        ctx.save();
        ctx.translate(shakeX, shakeY);

        drawParallaxBackground();

        ctx.save();
        ctx.translate(-cameraX, 0);

        drawPlatforms();
        drawHazards();
        drawCoins();
        drawPowerUps();
        drawEnemies();
        drawDoor();
        drawPlayer();
        drawParticles();
        drawFloatingTexts();

        ctx.restore();

        drawDamageOverlay();
        ctx.restore();
    }

    // Touch kontrolları
    const setupInput = (id, key) => {
        const el = document.getElementById(id);
        const start = (e) => {
            e.preventDefault();
            ensureAudio();
            inputs[key] = true;
        };
        const end = (e) => {
            e.preventDefault();
            inputs[key] = false;
        };

        el.addEventListener("touchstart", start, { passive: false });
        el.addEventListener("touchend", end, { passive: false });
        el.addEventListener("touchcancel", end, { passive: false });

        el.addEventListener("mousedown", start);
        el.addEventListener("mouseup", end);
        el.addEventListener("mouseleave", end);
    };

    setupInput("leftBtn", "left");
    setupInput("rightBtn", "right");
    setupInput("jumpBtn", "jump");

    window.addEventListener("keydown", (e) => {
        ensureAudio();

        if (["ArrowLeft", "ArrowRight", "ArrowUp", "Space", "KeyP"].includes(e.code)) {
            e.preventDefault();
        }

        if (e.code === "KeyP") {
            togglePause();
            return;
        }

        if (state !== GAME_STATE.PLAYING) return;

        if (e.code === "ArrowLeft") inputs.left = true;
        if (e.code === "ArrowRight") inputs.right = true;
        if (e.code === "Space" || e.code === "ArrowUp") inputs.jump = true;
    });

    window.addEventListener("keyup", (e) => {
        if (e.code === "ArrowLeft") inputs.left = false;
        if (e.code === "ArrowRight") inputs.right = false;
        if (e.code === "Space" || e.code === "ArrowUp") inputs.jump = false;
    });

    pauseBtn.addEventListener("click", () => {
        ensureAudio();
        if (state === GAME_STATE.PLAYING || state === GAME_STATE.PAUSED) {
            togglePause();
        }
    });

    soundBtn.addEventListener("click", () => {
        setSoundEnabled(!soundState.enabled);
    });

    playBtn.addEventListener("click", () => {
        startGame();
    });

    skinWrap.addEventListener("click", (e) => {
        const btn = e.target.closest(".skin-btn");
        if (!btn) return;
        applySkin(btn.dataset.skin);
    });

    // İlkin yükləmə
    resize();
    levels = buildLevels();
    loadLevel(0);
    applySkin((localStorage.getItem(SKIN_KEY) || "red"));
    syncSoundUi();
    refreshMenuMeta();
    showMenu();
    update();
</script>
</body>
</html>
