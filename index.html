<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Red Ball Pro Prototip</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #87CEEB;
            font-family: Arial, sans-serif;
            user-select: none;
        }

        canvas {
            display: block;
            background: linear-gradient(#87CEEB, #E0F7FA);
        }

        /* Yuxarı HUD (xal, rekord, can, səviyyə) */
        .hud {
            position: fixed;
            top: 12px;
            left: 12px;
            right: 12px;
            z-index: 20;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #fff;
            font-weight: bold;
            text-shadow: 0 2px 3px rgba(0, 0, 0, 0.5);
            pointer-events: none;
            font-size: 20px;
        }

        .hud-right {
            text-align: right;
            line-height: 1.4;
        }

        /* Planşet kontrolları */
        .ui-overlay {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            z-index: 30;
        }

        .move-btns {
            display: flex;
            gap: 15px;
            pointer-events: auto;
        }

        .action-btns {
            pointer-events: auto;
        }

        .btn {
            width: 70px;
            height: 70px;
            background: rgba(255, 255, 255, 0.3);
            border: 3px solid white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            color: white;
            touch-action: none;
        }

        .btn:active {
            background: rgba(255, 255, 255, 0.6);
            transform: scale(0.9);
        }

        .jump-btn {
            width: 90px;
            height: 90px;
            background: rgba(255, 0, 0, 0.4);
        }

        /* Game over / level complete ekranı */
        .message-screen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.45);
            color: #fff;
            z-index: 40;
            text-align: center;
        }

        .message-screen.hidden {
            display: none;
        }

        .message-title {
            font-size: 52px;
            margin: 0 0 12px;
            text-shadow: 0 3px 6px rgba(0, 0, 0, 0.5);
        }

        .message-subtitle {
            margin: 0 0 20px;
            font-size: 22px;
        }

        .restart-btn {
            font-size: 22px;
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            background: #ff3d00;
            color: #fff;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div class="hud" id="hud">
        <div id="scoreText">Xal: 0 | Rekord: 0</div>
        <div class="hud-right">
            <div id="livesText">❤️❤️❤️</div>
            <div id="levelText">Səviyyə 1</div>
        </div>
    </div>

    <div class="message-screen hidden" id="messageScreen">
        <h1 class="message-title" id="messageTitle">Game Over</h1>
        <p class="message-subtitle" id="messageSubtitle">Yenidən cəhd et!</p>
        <button class="restart-btn" id="restartBtn">Yenidən Başla</button>
    </div>

    <div class="ui-overlay">
        <div class="move-btns">
            <div class="btn" id="leftBtn">◀</div>
            <div class="btn" id="rightBtn">▶</div>
        </div>
        <div class="action-btns">
            <div class="btn jump-btn" id="jumpBtn">▲</div>
        </div>
    </div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const scoreText = document.getElementById("scoreText");
    const livesText = document.getElementById("livesText");
    const levelText = document.getElementById("levelText");
    const messageScreen = document.getElementById("messageScreen");
    const messageTitle = document.getElementById("messageTitle");
    const messageSubtitle = document.getElementById("messageSubtitle");
    const restartBtn = document.getElementById("restartBtn");

    const HIGH_SCORE_KEY = "red_ball_high_score";

    const LANDING_SQUASH_SPEED_THRESHOLD = 2;
    const JUMP_STRETCH_SPEED_THRESHOLD = -2;
    const SQUASH_LAND_X = 1.22;
    const SQUASH_LAND_Y = 0.82;
    const STRETCH_JUMP_X = 0.9;
    const STRETCH_JUMP_Y = 1.14;
    const STOMP_MIN_VELOCITY = 1;
    const STOMP_POSITION_FACTOR = 0.2;
    const LEVEL_TRANSITION_FRAMES = 80;
    const CLOUD_PARALLAX_FACTOR = 0.25;
    const MOUNTAIN_PARALLAX_FACTOR = 0.5;

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        rebuildLevelAfterResize();
    }
    window.addEventListener("resize", resize);

    // Oyun vəziyyətləri
    const GAME_STATE = {
        PLAYING: "playing",
        LEVEL_COMPLETE: "level_complete",
        GAME_OVER: "game_over",
        VICTORY: "victory"
    };

    // Oyunçu obyekti
    const player = {
        x: 100,
        y: 100,
        radius: 20,
        vx: 0,
        vy: 0,
        speed: 5,
        jumpPower: -15,
        gravity: 0.8,
        grounded: false,
        prevGrounded: false,
        color: "#FF3D00",
        squashX: 1,
        squashY: 1
    };

    let levels = [];
    let currentLevelIndex = 0;
    let level = null;

    let platforms = [];
    let hazards = [];
    let coins = [];
    let enemies = [];

    let cameraX = 0;
    let score = 0;
    let highScore = Number(localStorage.getItem(HIGH_SCORE_KEY)) || 0;
    let lives = 3;
    let state = GAME_STATE.PLAYING;
    let transitionTimer = 0;

    const inputs = { left: false, right: false, jump: false };

    function cloneRects(items) {
        return items.map((item) => ({ ...item }));
    }

                ],
                hazards: [

                    { x: 1210, y: groundY, w: 45, h: 40 },
                    { x: 1490, y: groundY, w: 45, h: 40 },
                    { x: 1770, y: groundY, w: 45, h: 40 },
                    { x: 2050, y: groundY, w: 45, h: 40 },

                ],
                coins: [
                    { x: 320, y: groundY - 160, r: 11, collected: false },
                    { x: 570, y: groundY - 290, r: 11, collected: false },
                    { x: 1080, y: groundY - 320, r: 11, collected: false },
                    { x: 1610, y: groundY - 340, r: 11, collected: false },
                    { x: 2170, y: groundY - 360, r: 11, collected: false },
                    { x: 2780, y: groundY - 380, r: 11, collected: false },
                    { x: 3140, y: groundY - 260, r: 11, collected: false }
                ],
                enemies: [

                    { x: 1320, y: groundY - 205, r: 18, vx: 2.1, minX: 1290, maxX: 1390, alive: true },
                    { x: 1890, y: groundY - 215, r: 18, vx: 2.3, minX: 1840, maxX: 1960, alive: true },
                    { x: 2460, y: groundY - 235, r: 18, vx: 2.5, minX: 2420, maxX: 2520, alive: true }
                ],

                clouds: [
                    { x: 110, y: 80, r: 25 },
                    { x: 700, y: 110, r: 34 },
                    { x: 1290, y: 90, r: 23 },
                    { x: 1850, y: 120, r: 31 },

                    { x: 3220, y: 110, r: 27 }
                ],
                mountains: [
                    { x: 40, w: 250, h: 90 },
                    { x: 360, w: 380, h: 150 },
                    { x: 870, w: 280, h: 120 },
                    { x: 1300, w: 430, h: 185 },

            }
        ];
    }

    function updateHighScore() {
        if (score > highScore) {
            highScore = score;
            localStorage.setItem(HIGH_SCORE_KEY, String(highScore));
        }
    }

    function updateHud() {
        scoreText.textContent = `Xal: ${score} | Rekord: ${highScore}`;
        const hearts = "❤️".repeat(Math.max(0, lives)) || "❌";
        livesText.textContent = `Can: ${hearts}`;
        levelText.textContent = `${level ? level.name : "Səviyyə"}`;
    }

    function showMessage(title, subtitle, showRestart) {
        messageTitle.textContent = title;
        messageSubtitle.textContent = subtitle;
        restartBtn.style.display = showRestart ? "inline-block" : "none";
        messageScreen.classList.remove("hidden");
    }

    function hideMessage() {
        messageScreen.classList.add("hidden");
    }

    // Səviyyəni yüklə
    function loadLevel(index) {
        currentLevelIndex = index;
        level = levels[currentLevelIndex];
        platforms = cloneRects(level.platforms);
        hazards = cloneRects(level.hazards);
        coins = level.coins.map((coin) => ({ ...coin }));
        enemies = level.enemies.map((enemy) => ({ ...enemy }));
        exitDoor = { ...level.exitDoor };

        player.x = level.spawn.x;
        player.y = level.spawn.y;
        player.vx = 0;
        player.vy = 0;
        player.grounded = false;
        player.prevGrounded = false;
        player.squashX = 1;
        player.squashY = 1;

        cameraX = 0;
        transitionTimer = 0;
        state = GAME_STATE.PLAYING;
        hideMessage();
        updateHud();
    }

    function startGame() {
        score = 0;
        lives = 3;
        levels = buildLevels();
        loadLevel(0);
    }

    function rebuildLevelAfterResize() {
        if (!canvas.width || !canvas.height) {
            return;
        }

        const oldScore = score;
        const oldLives = lives;
        const oldIndex = currentLevelIndex;
        const oldState = state;

        levels = buildLevels();
        score = oldScore;
        lives = oldLives;

        if (oldState === GAME_STATE.GAME_OVER || oldState === GAME_STATE.VICTORY) {
            loadLevel(Math.min(oldIndex, levels.length - 1));
            state = oldState;
            if (oldState === GAME_STATE.GAME_OVER) {
                showMessage("Game Over", "Canlar bitdi", true);
            } else {
                showMessage("Təbriklər!", "Bütün səviyyələr bitdi", true);
            }
        } else {
            loadLevel(Math.min(oldIndex, levels.length - 1));
        }

        updateHud();
    }

    function addScore(points) {
        score += points;
        updateHighScore();
        updateHud();
    }

    function loseLife() {
        if (state !== GAME_STATE.PLAYING) {
            return;
        }

        lives -= 1;
        updateHud();

        if (lives <= 0) {
            state = GAME_STATE.GAME_OVER;
            showMessage("Game Over", "Canlar bitdi", true);
            return;
        }

        // Can qaldıqda eyni səviyyənin başlanğıcına qaytar
        player.x = level.spawn.x;
        player.y = level.spawn.y;
        player.vx = 0;
        player.vy = 0;
        player.grounded = false;
        player.prevGrounded = false;
        cameraX = Math.max(0, player.x - canvas.width / 2);
    }

    function checkAABBCircle(cx, cy, cr, rect) {
        const nearestX = Math.max(rect.x, Math.min(cx, rect.x + rect.w));
        const nearestY = Math.max(rect.y, Math.min(cy, rect.y + rect.h));
        const dx = cx - nearestX;
        const dy = cy - nearestY;
        return dx * dx + dy * dy <= cr * cr;
    }

    function updatePlayerPhysics() {
        if (inputs.left) player.vx = -player.speed;
        else if (inputs.right) player.vx = player.speed;
        else player.vx *= 0.82;

        const prevVy = player.vy;
        const prevBottom = player.y + player.radius;

        player.vy += player.gravity;
        player.x += player.vx;
        player.y += player.vy;

        player.grounded = false;

        // Platforma üst səth toqquşması
        platforms.forEach((p) => {
            const inHorizontalRange = player.x + player.radius > p.x && player.x - player.radius < p.x + p.w;
            const currentBottom = player.y + player.radius;
            if (inHorizontalRange && prevBottom <= p.y && currentBottom >= p.y) {
                player.y = p.y - player.radius;
                player.vy = 0;
                player.grounded = true;
            }
        });

        // Dünya sərhədləri
        player.x = Math.max(player.radius, Math.min(level.worldWidth - player.radius, player.x));

        // Boşluğa düşərsə can itir
        if (player.y - player.radius > canvas.height + FALL_DEATH_OFFSET) {
            loseLife();
        }

        // Top üçün squash/stretch animasiyası
        if (player.grounded && !player.prevGrounded && Math.abs(prevVy) > LANDING_SQUASH_SPEED_THRESHOLD) {
            player.squashX = SQUASH_LAND_X;
            player.squashY = SQUASH_LAND_Y;
        } else if (!player.grounded && player.vy < JUMP_STRETCH_SPEED_THRESHOLD) {
            player.squashX = STRETCH_JUMP_X;
            player.squashY = STRETCH_JUMP_Y;
        }
        player.squashX += (1 - player.squashX) * 0.24;
        player.squashY += (1 - player.squashY) * 0.24;
        player.prevGrounded = player.grounded;
    }

    function updateCoins() {
        coins.forEach((coin) => {
            if (coin.collected) return;
            const dx = player.x - coin.x;
            const dy = player.y - coin.y;
            const distSq = dx * dx + dy * dy;
            const r = player.radius + coin.r;
            if (distSq <= r * r) {
                coin.collected = true;
                addScore(10);
            }
        });
    }

    function updateHazards() {
        for (const hazard of hazards) {
            const hazardRect = {
                x: hazard.x,
                y: hazard.y - hazard.h,
                w: hazard.w,
                h: hazard.h
            };
            if (checkAABBCircle(player.x, player.y, player.radius, hazardRect)) {
                loseLife();
                break;
            }
        }
    }

    function updateEnemies() {
        for (const enemy of enemies) {
            if (!enemy.alive) continue;

            enemy.x += enemy.vx;
            if (enemy.x - enemy.r <= enemy.minX || enemy.x + enemy.r >= enemy.maxX) {
                enemy.vx *= -1;
            }

            const dx = player.x - enemy.x;
            const dy = player.y - enemy.y;
            const distance = Math.hypot(dx, dy);

            if (distance <= player.radius + enemy.r) {
                const stompFromTop =
                    player.vy > STOMP_MIN_VELOCITY &&
                    player.y < enemy.y - enemy.r * STOMP_POSITION_FACTOR;
                if (stompFromTop) {
                    enemy.alive = false;
                    player.vy = player.jumpPower * 0.62;
                    addScore(25);
                } else {
                    loseLife();
                    break;
                }
            }
        }
    }

    function updateExitDoor() {
        if (!exitDoor) return;

        const insideDoor =
            player.x + player.radius > exitDoor.x &&
            player.x - player.radius < exitDoor.x + exitDoor.w &&
            player.y + player.radius > exitDoor.y &&
            player.y - player.radius < exitDoor.y + exitDoor.h;

        if (insideDoor && state === GAME_STATE.PLAYING) {
            state = GAME_STATE.LEVEL_COMPLETE;
            transitionTimer = LEVEL_TRANSITION_FRAMES;
            showMessage("Level Complete!", `${level.name} bitdi`, false);
        }
    }

    function update() {
        if (state === GAME_STATE.PLAYING) {
            if (inputs.jump && player.grounded) {
                player.vy = player.jumpPower;
                player.grounded = false;
            }

            updatePlayerPhysics();
            updateCoins();
            updateHazards();
            updateEnemies();
            updateExitDoor();

            cameraX = Math.max(0, Math.min(level.worldWidth - canvas.width, player.x - canvas.width / 2));
        } else if (state === GAME_STATE.LEVEL_COMPLETE) {
            transitionTimer -= 1;
            if (transitionTimer <= 0) {
                if (currentLevelIndex < levels.length - 1) {
                    loadLevel(currentLevelIndex + 1);
                } else {
                    state = GAME_STATE.VICTORY;
                    showMessage("Təbriklər!", "Bütün səviyyələr tamamlandı", true);
                }
            }
        }

        draw();
        requestAnimationFrame(update);
    }

    // Paralaks buludlar
    function drawCloud(cloudX, cloudY, radius) {
        ctx.fillStyle = "rgba(255,255,255,0.85)";
        ctx.beginPath();
        ctx.arc(cloudX, cloudY, radius, 0, Math.PI * 2);
        ctx.arc(cloudX + radius * 0.9, cloudY + 2, radius * 0.8, 0, Math.PI * 2);
        ctx.arc(cloudX - radius * 0.9, cloudY + 4, radius * 0.72, 0, Math.PI * 2);
        ctx.fill();
    }

    // Paralaks dağlar
    function drawMountain(x, width, height) {
        const baseY = canvas.height - 50;
        ctx.beginPath();
        ctx.moveTo(x, baseY);
        ctx.lineTo(x + width / 2, baseY - height);
        ctx.lineTo(x + width, baseY);
        ctx.closePath();
        ctx.fill();
    }

    function drawParallaxBackground() {
        // Arxa qat: buludlar (daha yavaş)
        level.clouds.forEach((cloud) => {
            const x = cloud.x - cameraX * CLOUD_PARALLAX_FACTOR;
            drawCloud(x, cloud.y, cloud.r);
        });

        // Orta qat: dağlar (orta sürət)
        ctx.fillStyle = "rgba(96, 125, 139, 0.45)";
        level.mountains.forEach((mountain) => {
            const x = mountain.x - cameraX * MOUNTAIN_PARALLAX_FACTOR;
            drawMountain(x, mountain.w, mountain.h);
        });
    }

    function drawCoins() {
        coins.forEach((coin) => {
            if (coin.collected) return;
            ctx.beginPath();
            ctx.arc(coin.x, coin.y, coin.r, 0, Math.PI * 2);
            ctx.fillStyle = "#FFD700";
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = "#B8860B";
            ctx.stroke();
        });
    }

    function drawHazards() {
        ctx.fillStyle = "#37474F";
        hazards.forEach((h) => {
            ctx.beginPath();
            ctx.moveTo(h.x, h.y);
            ctx.lineTo(h.x + h.w / 2, h.y - h.h);
            ctx.lineTo(h.x + h.w, h.y);
            ctx.fill();
        });
    }

    function drawEnemies() {
        enemies.forEach((enemy) => {
            if (!enemy.alive) return;
            ctx.beginPath();
            ctx.arc(enemy.x, enemy.y, enemy.r, 0, Math.PI * 2);
            ctx.fillStyle = "#111";
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = "#333";
            ctx.stroke();
        });
    }

    function drawDoor() {
        if (!exitDoor) return;
        ctx.fillStyle = "#00BCD4";
        ctx.fillRect(exitDoor.x, exitDoor.y, exitDoor.w, exitDoor.h);
        ctx.fillStyle = "#B2EBF2";
        ctx.fillRect(exitDoor.x + 8, exitDoor.y + 8, exitDoor.w - 16, exitDoor.h - 16);

        // Bayraq
        ctx.fillStyle = "#795548";
        ctx.fillRect(exitDoor.x + exitDoor.w + 10, exitDoor.y - 70, 6, 70);
        ctx.fillStyle = "#FFEB3B";
        ctx.beginPath();
        ctx.moveTo(exitDoor.x + exitDoor.w + 16, exitDoor.y - 70);
        ctx.lineTo(exitDoor.x + exitDoor.w + 55, exitDoor.y - 52);
        ctx.lineTo(exitDoor.x + exitDoor.w + 16, exitDoor.y - 35);
        ctx.closePath();
        ctx.fill();
    }

    function drawPlatforms() {
        platforms.forEach((p) => {
            ctx.fillStyle = "#4CAF50";
            ctx.fillRect(p.x, p.y, p.w, p.h);
            ctx.fillStyle = "#388E3C";
            ctx.fillRect(p.x, p.y, p.w, 5);
        });
    }

    function drawPlayer() {
        ctx.save();
        ctx.translate(player.x, player.y);
        // Top üçün squash & stretch effekti
        ctx.scale(player.squashX, player.squashY);

        ctx.beginPath();
        ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
        ctx.fillStyle = player.color;
        ctx.fill();
        ctx.strokeStyle = "black";
        ctx.lineWidth = 2;
        ctx.stroke();

        // Gözlər
        ctx.fillStyle = "white";
        ctx.beginPath();
        ctx.arc(8, -5, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "black";
        ctx.beginPath();
        ctx.arc(10, -5, 2, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        drawParallaxBackground();

        ctx.save();
        ctx.translate(-cameraX, 0);

        drawPlatforms();
        drawHazards();
        drawCoins();
        drawEnemies();
        drawDoor();
        drawPlayer();

        ctx.restore();
    }

    // Touch kontrolları
    const setupInput = (id, key) => {
        const el = document.getElementById(id);
        const start = (e) => {
            e.preventDefault();
            inputs[key] = true;
        };
        const end = (e) => {
            e.preventDefault();
            inputs[key] = false;
        };

        el.addEventListener("touchstart", start, { passive: false });
        el.addEventListener("touchend", end, { passive: false });
        el.addEventListener("touchcancel", end, { passive: false });
    };

    setupInput("leftBtn", "left");
    setupInput("rightBtn", "right");
    setupInput("jumpBtn", "jump");

    // Klaviatura kontrolları
    window.addEventListener("keydown", (e) => {
        if (["ArrowLeft", "ArrowRight", "ArrowUp", "Space"].includes(e.code)) {
            e.preventDefault();
        }
        if (e.code === "ArrowLeft") inputs.left = true;
        if (e.code === "ArrowRight") inputs.right = true;
        if (e.code === "Space" || e.code === "ArrowUp") inputs.jump = true;
    });

    window.addEventListener("keyup", (e) => {
        if (e.code === "ArrowLeft") inputs.left = false;
        if (e.code === "ArrowRight") inputs.right = false;
        if (e.code === "Space" || e.code === "ArrowUp") inputs.jump = false;
    });

    restartBtn.addEventListener("click", () => {
        hideMessage();
        startGame();
    });

    // İlkin yükləmə
    resize();
    if (!levels.length) {
        levels = buildLevels();
    }
    startGame();
    update();
</script>
</body>
</html>
