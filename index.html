<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Red Ball Pro</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #87CEEB;
            font-family: Arial, sans-serif;
            user-select: none;
        }

        canvas {
            display: block;
            background: linear-gradient(#87CEEB, #E0F7FA);
        }

        /* Yuxarı HUD */
        .hud {
            position: fixed;
            top: 12px;
            left: 12px;
            right: 12px;
            z-index: 20;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            color: #fff;
            font-weight: bold;
            text-shadow: 0 2px 3px rgba(0, 0, 0, 0.5);
            font-size: 20px;
            pointer-events: none;
        }

        .hud-right {
            text-align: right;
            line-height: 1.4;
        }

        .hud-controls {
            margin-top: 8px;
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            pointer-events: auto;
        }

        .mini-btn {
            border: none;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.45);
            color: #fff;
            padding: 6px 10px;
            font-size: 16px;
            cursor: pointer;
        }

        .power-timer {
            margin-top: 4px;
            font-size: 16px;
            color: #ffeb3b;
        }

        /* Planşet kontrolları */
        .ui-overlay {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            z-index: 30;
        }

        .move-btns {
            display: flex;
            gap: 15px;
            pointer-events: auto;
        }

        .action-btns {
            pointer-events: auto;
        }

        .btn {
            width: 70px;
            height: 70px;
            background: rgba(255, 255, 255, 0.3);
            border: 3px solid white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            color: white;
            touch-action: none;
        }

        .btn:active {
            background: rgba(255, 255, 255, 0.6);
            transform: scale(0.9);
        }

        .jump-btn {
            width: 90px;
            height: 90px;
            background: rgba(255, 0, 0, 0.4);
        }

        /* Menyu ekranı */
        .overlay-screen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            z-index: 40;
            text-align: center;
            padding: 16px;
        }

        .overlay-screen.hidden {
            display: none;
        }

        .overlay-title {
            font-size: 52px;
            margin: 0 0 12px;
            text-shadow: 0 3px 6px rgba(0, 0, 0, 0.5);
        }

        .overlay-subtitle {
            margin: 0 0 14px;
            font-size: 22px;
            white-space: pre-line;
        }

        .overlay-btns {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 12px;
        }

        .overlay-btn {
            font-size: 20px;
            padding: 10px 18px;
            border: none;
            border-radius: 10px;
            background: #ff3d00;
            color: #fff;
            cursor: pointer;
        }

        .menu-meta {
            font-size: 18px;
            margin-bottom: 10px;
        }

        .skins {
            display: flex;
            gap: 10px;
            margin: 8px 0 12px;
            justify-content: center;
        }

        .skin-btn {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 3px solid #fff;
            cursor: pointer;
            opacity: 0.7;
        }

        .skin-btn.active {
            transform: scale(1.12);
            opacity: 1;
            box-shadow: 0 0 0 2px #ffeb3b;
        }

        .leaderboard {
            margin: 0;
            padding-left: 22px;
            text-align: left;
            font-size: 18px;
            min-width: 180px;
        }
    </style>
</head>

    // Səs sistemi (Web Audio API)
    let audioCtx = null;

    function ensureAudio() {
        if (audioCtx) return;
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) {
            soundEnabled = false;
            return;
        }
        audioCtx = new Ctx();
        musicOsc = audioCtx.createOscillator();
        musicGain = audioCtx.createGain();
        musicOsc.type = "triangle";
        musicOsc.frequency.value = 110;
        musicGain.gain.value = 0.0001;
        musicOsc.connect(musicGain).connect(audioCtx.destination);
        musicOsc.start();
    }

    function toggleMusic() {
        if (!audioCtx || !musicGain) return;
        const target = soundEnabled && state === GAME_STATE.PLAYING ? 0.035 : 0.0001;
        musicGain.gain.setTargetAtTime(target, audioCtx.currentTime, 0.08);
    }

    function playSound(freq, duration = 0.12, type = "sine", vol = 0.08) {
        if (!soundEnabled) return;
        ensureAudio();
        if (!audioCtx) return;

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    }

    function getTheme() {
        const themes = [
            { skyTop: "#87CEEB", skyBottom: "#E0F7FA", mountain: "rgba(96,125,139,0.45)", cloud: "rgba(255,255,255,0.85)" },
            { skyTop: "#FFB74D", skyBottom: "#FFE0B2", mountain: "rgba(121,85,72,0.45)", cloud: "rgba(255,244,214,0.8)" },
            { skyTop: "#1A237E", skyBottom: "#283593", mountain: "rgba(55,71,79,0.65)", cloud: "rgba(200,220,255,0.55)" }
        ];
        return themes[Math.min(currentLevelIndex, themes.length - 1)] || themes[0];
    }

    function updateHighScore() {
        if (score > highScore) {
            highScore = score;
            localStorage.setItem(HIGH_SCORE_KEY, String(highScore));
        }
    }

    function loadLeaderboard() {
        try {
            const parsed = JSON.parse(localStorage.getItem(LEADERBOARD_KEY) || "[]");
            leaderboard = Array.isArray(parsed) ? parsed.map(Number).filter((x) => Number.isFinite(x)) : [];
        } catch {
            leaderboard = [];
        }
    }

    function saveLeaderboard(newScore) {
        loadLeaderboard();
        leaderboard.push(newScore);
        leaderboard.sort((a, b) => b - a);
        leaderboard = leaderboard.slice(0, 5);
        localStorage.setItem(LEADERBOARD_KEY, JSON.stringify(leaderboard));
    }

    function renderLeaderboard() {
        loadLeaderboard();
        leaderboardEl.innerHTML = "";
        if (!leaderboard.length) {
            const li = document.createElement("li");
            li.textContent = "Hələ nəticə yoxdur";
            leaderboardEl.appendChild(li);
            return;
        }
        leaderboard.forEach((item, index) => {
            const li = document.createElement("li");
            li.textContent = `${index + 1}. ${item} xal`;
            leaderboardEl.appendChild(li);
        });
    }

    function updateHud() {
        scoreText.textContent = `Xal: ${score} | Rekord: ${highScore}`;
        livesText.textContent = `Can: ${"❤️".repeat(Math.max(0, lives))}`;
        levelText.textContent = `${level ? level.name : "Səviyyə"}`;
        if (activePower) {
            const sec = Math.ceil(activePower.timer / 60);
            const names = { star: "⭐ Ulduz", speed: "💨 Sürət", magnet: "🧲 Maqnit" };
            powerText.textContent = `${names[activePower.type]}: ${sec}s`;
        } else {
            powerText.textContent = "";
        }
    }

    function applyPlayerColor() {
        player.color = activePower ? POWER_COLORS[activePower.type] : selectedSkin;
    }

    function setState(nextState) {
        state = nextState;
        toggleMusic();
        renderOverlay();
    }

    function renderOverlay() {
        overlayButtons.innerHTML = "";

        const addButton = (text, onClick) => {
            const btn = document.createElement("button");
            btn.className = "overlay-btn";
            btn.textContent = text;
            btn.onclick = onClick;
            overlayButtons.appendChild(btn);
        };

        if (state === GAME_STATE.MENU) {
            overlayScreen.classList.remove("hidden");
            overlayTitle.textContent = "Red Ball Pro";
            overlaySubtitle.textContent = "Macəraya başla!";
            menuMeta.textContent = `Rekord xal: ${highScore}`;
            skinsEl.style.display = "flex";
            leaderboardEl.style.display = "block";
            renderSkinButtons();
            renderLeaderboard();
            addButton("Oyna", () => startGame());
            return;
        }

        skinsEl.style.display = "none";
        leaderboardEl.style.display = "none";
        menuMeta.textContent = "";

        if (state === GAME_STATE.PAUSED) {
            overlayScreen.classList.remove("hidden");
            overlayTitle.textContent = "Fasilə";
            overlaySubtitle.textContent = "Oyun dayandırıldı";
            addButton("Davam et", () => setState(GAME_STATE.PLAYING));
        } else if (state === GAME_STATE.GAME_OVER) {
            overlayScreen.classList.remove("hidden");
            overlayTitle.textContent = "Game Over";
            overlaySubtitle.textContent = `Cari xal: ${score}\nRekord: ${highScore}`;
            addButton("Yenidən Oyna", () => startGame());
            addButton("Baş Menyu", () => setState(GAME_STATE.MENU));
        } else if (state === GAME_STATE.LEVEL_COMPLETE) {
            overlayScreen.classList.remove("hidden");
            overlayTitle.textContent = "Səviyyə Tamamlandı";
            overlaySubtitle.textContent = `${level.name} bitdi`;
            addButton("Növbəti Səviyyə", () => gotoNextLevel());
        } else if (state === GAME_STATE.VICTORY) {
            overlayScreen.classList.remove("hidden");
            overlayTitle.textContent = "Təbriklər!";
            overlaySubtitle.textContent = `Bütün səviyyələr tamamlandı\nXal: ${score}`;
            addButton("Yenidən Oyna", () => startGame());
            addButton("Baş Menyu", () => setState(GAME_STATE.MENU));
        } else {
            overlayScreen.classList.add("hidden");
        }
    }

    function renderSkinButtons() {
        skinsEl.innerHTML = "";
        SKINS.forEach((skin) => {
            const btn = document.createElement("button");
            btn.className = `skin-btn ${selectedSkin === skin.color ? "active" : ""}`;
            btn.style.background = skin.color;
            btn.title = skin.name;
            btn.onclick = () => {
                selectedSkin = skin.color;
                localStorage.setItem(SKIN_KEY, selectedSkin);
                applyPlayerColor();
                renderSkinButtons();
            };
            skinsEl.appendChild(btn);
        });
    }

    function normalizeLevelObjects() {
        platforms.forEach((p) => {
            p.baseX = p.x;
            p.baseY = p.y;
            p.t = 0;
            p.dir = 1;
            p.breakTimer = null;
            p.broken = false;
            p.fallVy = 0;
            p.prevX = p.x;
            p.prevY = p.y;
        });
    }

    function loadLevel(index) {
        currentLevelIndex = index;
        level = levels[currentLevelIndex];
        platforms = cloneRects(level.platforms);
        hazards = cloneRects(level.hazards);
        coins = level.coins.map((coin) => ({ ...coin, visible: !coin.hidden }));
        enemies = level.enemies.map((enemy) => ({ ...enemy }));
        powerUps = level.powerUps.map((p) => ({ ...p }));
        exitDoor = { ...level.exitDoor };

        normalizeLevelObjects();

        player.x = level.spawn.x;
        player.y = level.spawn.y;
        player.vx = 0;
        player.vy = 0;
        player.grounded = false;
        player.prevGrounded = false;
        player.squashX = 1;
        player.squashY = 1;
        player.standPlatformId = null;

        activePower = null;
        applyPlayerColor();

        cameraX = 0;
        updateHud();
    }

    function startGame() {
        ensureAudio();
        if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();

        score = 0;
        lives = 3;
        levels = buildLevels();
        loadLevel(0);
        setState(GAME_STATE.PLAYING);
        updateHud();
    }

    function gotoNextLevel() {
        if (currentLevelIndex < levels.length - 1) {
            loadLevel(currentLevelIndex + 1);
            setState(GAME_STATE.PLAYING);
        } else {
            updateHighScore();
            saveLeaderboard(score);
            setState(GAME_STATE.VICTORY);
        }
    }

    function rebuildLevelAfterResize() {
        if (!canvas.width || !canvas.height) return;

        const oldScore = score;
        const oldLives = lives;
        const oldState = state;
        const oldIndex = currentLevelIndex;

        levels = buildLevels();

        if (oldState === GAME_STATE.MENU) {
            setState(GAME_STATE.MENU);
            return;
        }

        score = oldScore;
        lives = oldLives;
        loadLevel(Math.min(oldIndex, levels.length - 1));
        setState(oldState);
        updateHud();
    }

    function addParticle(x, y, color, count = 8, speed = 2.5) {
        for (let i = 0; i < count; i += 1) {
            const a = Math.random() * Math.PI * 2;
            const s = Math.random() * speed;
            particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 0.5, life: 28 + Math.random() * 20, color, r: 2 + Math.random() * 2 });
        }
    }

    function addFloatingText(x, y, text, color = "#fff") {
        floatingTexts.push({ x, y, text, life: 50, color });
    }

    function addScore(points, x = player.x, y = player.y - 15) {
        score += points;
        updateHighScore();
        addFloatingText(x, y, `+${points}`, "#ffeb3b");
        updateHud();
    }

    function triggerDamageFx() {
        screenShake = 10;
        redFlash = 12;
        playSound(120, 0.22, "sawtooth", 0.12);
    }

    function loseLife() {
        if (state !== GAME_STATE.PLAYING) return;
        if (activePower && activePower.type === "star") return;

        lives -= 1;
        triggerDamageFx();
        updateHud();

        if (lives <= 0) {
            updateHighScore();
            saveLeaderboard(score);
            setState(GAME_STATE.GAME_OVER);
            return;
        }

        player.x = level.spawn.x;
        player.y = level.spawn.y;
        player.vx = 0;
        player.vy = 0;
        player.grounded = false;
        player.prevGrounded = false;
        cameraX = Math.max(0, player.x - canvas.width / 2);
    }

    function checkAABBCircle(cx, cy, cr, rect) {
        const nearestX = Math.max(rect.x, Math.min(cx, rect.x + rect.w));
        const nearestY = Math.max(rect.y, Math.min(cy, rect.y + rect.h));
        const dx = cx - nearestX;
        const dy = cy - nearestY;
        return dx * dx + dy * dy <= cr * cr;
    }

    function activatePower(type) {
        const durations = { star: 300, speed: 240, magnet: 300 };
        activePower = { type, timer: durations[type] || 240 };
        applyPlayerColor();
        playSound(type === "star" ? 740 : type === "speed" ? 620 : 520, 0.2, "triangle", 0.1);
        updateHud();
    }

    function updatePlatforms() {
        platforms.forEach((p) => {
            p.prevX = p.x;
            p.prevY = p.y;

            if (p.type === "moving" && !p.broken) {
                p.t += p.speed * p.dir;
                if (Math.abs(p.t) >= p.range) {
                    p.dir *= -1;
                    p.t = Math.sign(p.t) * p.range;
                }
                if (p.axis === "y") p.y = p.baseY + p.t;
                else p.x = p.baseX + p.t;
            }

            if (p.type === "breakable" && p.breakTimer !== null && !p.broken) {
                p.breakTimer -= 1;
                if (p.breakTimer <= 0) {
                    p.broken = true;
                    p.fallVy = 1.2;
                }
            }

            if (p.broken) {
                p.fallVy += 0.35;
                p.y += p.fallVy;
            }
        });
    }

    function updatePlayerPhysics() {
        updatePlatforms();

        const speedMul = activePower?.type === "speed" ? 2 : 1;
        const targetSpeed = player.baseSpeed * speedMul;

        if (inputs.left) player.vx = -targetSpeed;
        else if (inputs.right) player.vx = targetSpeed;
        else player.vx *= player.onIce ? 0.96 : 0.82;

        const prevVy = player.vy;
        const prevBottom = player.y + player.radius;

        player.vy += player.gravity;
        player.x += player.vx;
        player.y += player.vy;

        player.grounded = false;
        player.onIce = false;
        player.standPlatformId = null;

        platforms.forEach((p) => {
            if (p.broken) return;
            const inHorizontalRange = player.x + player.radius > p.x && player.x - player.radius < p.x + p.w;
            const currentBottom = player.y + player.radius;

            if (inHorizontalRange && prevBottom <= p.y && currentBottom >= p.y) {
                player.y = p.y - player.radius;
                player.vy = 0;
                player.grounded = true;
                player.standPlatformId = p.id;

                if (p.type === "breakable" && p.breakTimer === null) p.breakTimer = 60;
                if (p.type === "bounce") {
                    player.vy = player.jumpPower * 1.35;
                    playSound(400, 0.09, "square", 0.07);
                }
                if (p.type === "ice") player.onIce = true;
            }
        });

        const standPlatform = platforms.find((p) => p.id === player.standPlatformId);
        if (standPlatform && standPlatform.type === "moving") {
            player.x += standPlatform.x - standPlatform.prevX;
            player.y += standPlatform.y - standPlatform.prevY;
        }

        player.x = Math.max(player.radius, Math.min(level.worldWidth - player.radius, player.x));

        if (player.y - player.radius > canvas.height + 300) loseLife();

        // Top üçün squash/stretch effekti
        if (player.grounded && !player.prevGrounded && Math.abs(prevVy) > 2) {
            player.squashX = 1.22;
            player.squashY = 0.82;
            addParticle(player.x, player.y + player.radius - 2, "rgba(220,220,220,0.8)", 7, 1.6);
        } else if (!player.grounded && player.vy < -2) {
            player.squashX = 0.9;
            player.squashY = 1.14;
        }
        player.squashX += (1 - player.squashX) * 0.24;
        player.squashY += (1 - player.squashY) * 0.24;
        player.prevGrounded = player.grounded;
    }

    function updateCoins() {
        coins.forEach((coin) => {
            if (coin.collected) return;

            const dx = player.x - coin.x;
            const dy = player.y - coin.y;
            const distance = Math.hypot(dx, dy);

            // Gizli sikkələr oyunçu yaxınlaşanda görünür
            if (coin.hidden && !coin.visible && distance < 170) coin.visible = true;

            // Maqnit gücü zamanı sikkələr avtomatik çəkilir
            if (activePower?.type === "magnet" && distance < 230) {
                const pull = Math.max(1.2, 7 - distance / 35);
                coin.x += (player.x - coin.x) / pull;
                coin.y += (player.y - coin.y) / pull;
            }

            const r = player.radius + coin.r;
            if (distance <= r) {
                coin.collected = true;
                addScore(10, coin.x, coin.y);
                addParticle(coin.x, coin.y, "#FFD700", 10, 2.2);
                playSound(820, 0.12, "triangle", 0.08);
            }
        });
    }

    function updatePowerUps() {
        powerUps.forEach((p) => {
            if (p.collected) return;
            const dist = Math.hypot(player.x - p.x, player.y - p.y);
            if (dist <= player.radius + p.r) {
                p.collected = true;
                activatePower(p.kind);
            }
        });

        if (activePower) {
            activePower.timer -= 1;
            if (activePower.timer <= 0) {
                activePower = null;
                applyPlayerColor();
            }
        }
        updateHud();
    }

    function updateHazards() {
        for (const hazard of hazards) {
            const hazardRect = { x: hazard.x, y: hazard.y - hazard.h, w: hazard.w, h: hazard.h };
            if (checkAABBCircle(player.x, player.y, player.radius, hazardRect)) {
                loseLife();
                break;
            }
        }
    }

    function destroyEnemy(enemy) {
        enemy.alive = false;
        addScore(25, enemy.x, enemy.y);
        addParticle(enemy.x, enemy.y, "#ff7043", 14, 3.1);
        playSound(300, 0.18, "square", 0.12);
    }

    function updateEnemies() {
        for (const enemy of enemies) {
            if (!enemy.alive) continue;

            enemy.x += enemy.vx;
            if (enemy.x - enemy.r <= enemy.minX || enemy.x + enemy.r >= enemy.maxX) enemy.vx *= -1;

            const distance = Math.hypot(player.x - enemy.x, player.y - enemy.y);
            if (distance <= player.radius + enemy.r) {
                if (activePower?.type === "star") {
                    destroyEnemy(enemy);
                    continue;
                }

                const stompFromTop = player.vy > 1 && player.y < enemy.y - enemy.r * 0.2;
                if (stompFromTop) {
                    destroyEnemy(enemy);
                    player.vy = player.jumpPower * 0.62;
                } else {
                    loseLife();
                    break;
                }
            }
        }
    }

    function updateExitDoor() {
        if (!exitDoor) return;

        const insideDoor =
            player.x + player.radius > exitDoor.x &&
            player.x - player.radius < exitDoor.x + exitDoor.w &&
            player.y + player.radius > exitDoor.y &&
            player.y - player.radius < exitDoor.y + exitDoor.h;

        if (insideDoor && state === GAME_STATE.PLAYING) setState(GAME_STATE.LEVEL_COMPLETE);
    }

    function updateFx() {
        particles = particles.filter((p) => {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.08;
            p.life -= 1;
            return p.life > 0;
        });

        floatingTexts = floatingTexts.filter((t) => {
            t.y -= 0.7;
            t.life -= 1;
            return t.life > 0;
        });

        if (screenShake > 0) screenShake -= 1;
        if (redFlash > 0) redFlash -= 1;
    }

    function update() {
        if (state === GAME_STATE.PLAYING) {
            if (inputs.jump && player.grounded) {
                player.vy = player.jumpPower;
                player.grounded = false;
                playSound(260, 0.12, "square", 0.08);
            }

            updatePlayerPhysics();
            updateCoins();
            updatePowerUps();
            updateHazards();
            updateEnemies();
            updateExitDoor();

            cameraX = Math.max(0, Math.min(level.worldWidth - canvas.width, player.x - canvas.width / 2));
        }

        updateFx();
        draw();
        requestAnimationFrame(update);
    }

    function drawCloud(cloudX, cloudY, radius, color) {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(cloudX, cloudY, radius, 0, Math.PI * 2);
        ctx.arc(cloudX + radius * 0.9, cloudY + 2, radius * 0.8, 0, Math.PI * 2);
        ctx.arc(cloudX - radius * 0.9, cloudY + 4, radius * 0.72, 0, Math.PI * 2);
        ctx.fill();
    }

    function drawMountain(x, width, height) {
        const baseY = canvas.height - 50;
        ctx.beginPath();
        ctx.moveTo(x, baseY);
        ctx.lineTo(x + width / 2, baseY - height);
        ctx.lineTo(x + width, baseY);
        ctx.closePath();
        ctx.fill();
    }

    function drawParallaxBackground() {
        if (!level) return;

        const theme = getTheme();
        const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
        sky.addColorStop(0, theme.skyTop);
        sky.addColorStop(1, theme.skyBottom);
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const cloudParallax = 0.25;
        level.clouds.forEach((cloud) => {
            drawCloud(cloud.x - cameraX * cloudParallax, cloud.y, cloud.r, theme.cloud);
        });

        const mountainParallax = 0.5;
        ctx.fillStyle = theme.mountain;
        level.mountains.forEach((mountain) => {
            drawMountain(mountain.x - cameraX * mountainParallax, mountain.w, mountain.h);
        });
    }

    function drawCoins() {
        coins.forEach((coin) => {
            if (coin.collected || !coin.visible) return;
            ctx.beginPath();
            ctx.arc(coin.x, coin.y, coin.r, 0, Math.PI * 2);
            ctx.fillStyle = "#FFD700";
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = "#B8860B";
            ctx.stroke();
        });
    }

    function drawPowerUps() {
        powerUps.forEach((p) => {
            if (p.collected) return;
            const colors = { star: "#FFD54F", speed: "#42A5F5", magnet: "#AB47BC" };
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fillStyle = colors[p.kind] || "#fff";
            ctx.fill();
            ctx.strokeStyle = "#fff";
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.fillStyle = "#111";
            ctx.font = "bold 12px Arial";
            const icon = p.kind === "star" ? "★" : p.kind === "speed" ? "⚡" : "🧲";
            ctx.fillText(icon, p.x - 7, p.y + 4);
        });
    }

    function drawHazards() {
        ctx.fillStyle = "#37474F";
        hazards.forEach((h) => {
            ctx.beginPath();
            ctx.moveTo(h.x, h.y);
            ctx.lineTo(h.x + h.w / 2, h.y - h.h);
            ctx.lineTo(h.x + h.w, h.y);
            ctx.fill();
        });
    }

    function drawEnemies() {
        enemies.forEach((enemy) => {
            if (!enemy.alive) return;
            ctx.beginPath();
            ctx.arc(enemy.x, enemy.y, enemy.r, 0, Math.PI * 2);
            ctx.fillStyle = "#111";
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = "#333";
            ctx.stroke();
        });
    }

    function drawDoor() {
        if (!exitDoor) return;
        ctx.fillStyle = "#00BCD4";
        ctx.fillRect(exitDoor.x, exitDoor.y, exitDoor.w, exitDoor.h);
        ctx.fillStyle = "#B2EBF2";
        ctx.fillRect(exitDoor.x + 8, exitDoor.y + 8, exitDoor.w - 16, exitDoor.h - 16);

        ctx.fillStyle = "#795548";
        ctx.fillRect(exitDoor.x + exitDoor.w + 10, exitDoor.y - 70, 6, 70);
        ctx.fillStyle = "#FFEB3B";
        ctx.beginPath();
        ctx.moveTo(exitDoor.x + exitDoor.w + 16, exitDoor.y - 70);
        ctx.lineTo(exitDoor.x + exitDoor.w + 55, exitDoor.y - 52);
        ctx.lineTo(exitDoor.x + exitDoor.w + 16, exitDoor.y - 35);
        ctx.closePath();
        ctx.fill();
    }

    function drawPlatforms() {
        platforms.forEach((p) => {
            if (p.broken && p.y > canvas.height + 200) return;

            let base = "#4CAF50";
            let top = "#388E3C";
            if (p.type === "moving") {
                base = "#26A69A";
                top = "#00897B";
            } else if (p.type === "breakable") {
                const breaking = p.breakTimer !== null && !p.broken;
                base = breaking ? "#EF5350" : "#8D6E63";
                top = breaking ? "#E53935" : "#6D4C41";
            } else if (p.type === "bounce") {
                base = "#FFA726";
                top = "#FB8C00";
            } else if (p.type === "ice") {
                base = "#81D4FA";
                top = "#4FC3F7";
            }

            const shakeX = p.type === "breakable" && p.breakTimer !== null && !p.broken ? (Math.random() - 0.5) * 3 : 0;
            ctx.fillStyle = base;
            ctx.fillRect(p.x + shakeX, p.y, p.w, p.h);
            ctx.fillStyle = top;
            ctx.fillRect(p.x + shakeX, p.y, p.w, 5);
        });
    }

    function drawPlayer() {
        ctx.save();
        ctx.translate(player.x, player.y);
        ctx.scale(player.squashX, player.squashY);

        ctx.beginPath();
        ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
        ctx.fillStyle = player.color;
        ctx.fill();
        ctx.strokeStyle = "black";
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = "white";
        ctx.beginPath();
        ctx.arc(8, -5, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "black";
        ctx.beginPath();
        ctx.arc(10, -5, 2, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }

    function drawEffects() {
        particles.forEach((p) => {
            ctx.globalAlpha = Math.max(0, p.life / 45);
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.fill();
        });
        ctx.globalAlpha = 1;

        floatingTexts.forEach((t) => {
            ctx.globalAlpha = Math.max(0, t.life / 50);
            ctx.fillStyle = t.color;
            ctx.font = "bold 20px Arial";
            ctx.fillText(t.text, t.x, t.y);
        });
        ctx.globalAlpha = 1;
    }

    function drawDamageOverlay() {
        if (redFlash <= 0) return;
        ctx.fillStyle = `rgba(255,0,0,${redFlash / 30})`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawParallaxBackground();

        ctx.save();

        if (screenShake > 0) {
            const shakeX = (Math.random() - 0.5) * screenShake;
            const shakeY = (Math.random() - 0.5) * screenShake;
            ctx.translate(shakeX, shakeY);
        }

        ctx.translate(-cameraX, 0);
        drawPlatforms();
        drawHazards();
        drawCoins();
        drawPowerUps();
        drawEnemies();
        drawDoor();
        drawPlayer();
        drawEffects();

        ctx.restore();
        drawDamageOverlay();
    }

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        rebuildLevelAfterResize();
    }
    window.addEventListener("resize", resize);

    // Touch kontrolları
    const setupInput = (id, key) => {
        const el = document.getElementById(id);
        const start = (e) => {
            e.preventDefault();
            inputs[key] = true;
        };
        const end = (e) => {
            e.preventDefault();
            inputs[key] = false;
        };

        el.addEventListener("touchstart", start, { passive: false });
        el.addEventListener("touchend", end, { passive: false });
        el.addEventListener("touchcancel", end, { passive: false });
    };

    setupInput("leftBtn", "left");
    setupInput("rightBtn", "right");
    setupInput("jumpBtn", "jump");

    // Klaviatura kontrolları
    window.addEventListener("keydown", (e) => {
        if (["ArrowLeft", "ArrowRight", "ArrowUp", "Space", "KeyP"].includes(e.code)) e.preventDefault();
        if (e.code === "ArrowLeft") inputs.left = true;
        if (e.code === "ArrowRight") inputs.right = true;
        if (e.code === "Space" || e.code === "ArrowUp") inputs.jump = true;

        if (e.code === "KeyP") {
            if (state === GAME_STATE.PLAYING) setState(GAME_STATE.PAUSED);
            else if (state === GAME_STATE.PAUSED) setState(GAME_STATE.PLAYING);
        }
    });

    window.addEventListener("keyup", (e) => {
        if (e.code === "ArrowLeft") inputs.left = false;
        if (e.code === "ArrowRight") inputs.right = false;
        if (e.code === "Space" || e.code === "ArrowUp") inputs.jump = false;
    });

    pauseBtn.addEventListener("click", () => {
        if (state === GAME_STATE.PLAYING) setState(GAME_STATE.PAUSED);
        else if (state === GAME_STATE.PAUSED) setState(GAME_STATE.PLAYING);
    });

    soundBtn.addEventListener("click", () => {
        soundEnabled = !soundEnabled;
        updateSoundButton();
        toggleMusic();
    });

    // İlkin yükləmə
    updateSoundButton();
    levels = buildLevels();
    loadLeaderboard();
    resize();
    setState(GAME_STATE.MENU);
    update();
</script>
</body>
</html>
