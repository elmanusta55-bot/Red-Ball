<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Red Ball Pro Prototip</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #87CEEB;
            font-family: Arial, sans-serif;
            user-select: none;
        }

        canvas {
            display: block;
            background: linear-gradient(#87CEEB, #E0F7FA);
        }

        /* Yuxarı HUD (xal, rekord, can, səviyyə, power-up) */
        .hud {
            position: fixed;
            top: 12px;
            left: 12px;
            right: 12px;
            z-index: 20;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #fff;
            font-weight: bold;
            text-shadow: 0 2px 3px rgba(0, 0, 0, 0.5);
            pointer-events: none;
            font-size: 20px;
        }

        .hud-right {
            text-align: right;
            line-height: 1.35;
        }

        .hud.hidden {
            display: none;
        }

        /* Sağ yuxarı utility düymələri */
        .top-controls {
            position: fixed;
            top: 12px;
            right: 12px;
            z-index: 45;
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            border: none;
            background: rgba(0, 0, 0, 0.35);
            color: #fff;
            font-size: 24px;
            cursor: pointer;
        }

        .icon-btn:active {
            transform: scale(0.95);
        }

        /* Planşet kontrolları */
        .ui-overlay {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            z-index: 30;
        }

        .move-btns {
            display: flex;
            gap: 15px;
            pointer-events: auto;
        }

        .action-btns {
            pointer-events: auto;
        }

        .btn {
            width: 70px;
            height: 70px;
            background: rgba(255, 255, 255, 0.3);
            border: 3px solid white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            color: white;
            touch-action: none;
        }

        .btn:active {
            background: rgba(255, 255, 255, 0.6);
            transform: scale(0.9);
        }

        .jump-btn {
            width: 90px;
            height: 90px;
            background: rgba(255, 0, 0, 0.4);
        }

        /* Menyu və ara ekranlar */
        .menu-screen,
        .message-screen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            z-index: 40;
            text-align: center;
            padding: 14px;
            box-sizing: border-box;
        }

        .message-screen.hidden,
        .menu-screen.hidden {
            display: none;
        }

        .menu-card {
            width: min(540px, 92vw);
            background: rgba(15, 25, 35, 0.9);
            border: 2px solid rgba(255, 255, 255, 0.25);
            border-radius: 16px;
            padding: 18px;
            max-height: 86vh;
            overflow-y: auto;
        }

        .message-title {
            font-size: 46px;
            margin: 0 0 10px;
            text-shadow: 0 3px 6px rgba(0, 0, 0, 0.5);
        }

        .message-subtitle {
            margin: 0 0 16px;
            font-size: 22px;
        }

        .menu-title {
            margin: 0 0 8px;
            font-size: 42px;
        }

        .menu-sub {
            margin: 0 0 12px;
            font-size: 18px;
            opacity: 0.95;
        }

        .section-title {
            margin: 14px 0 8px;
            font-size: 18px;
            color: #90caf9;
        }

        .leaderboard {
            list-style: decimal;
            text-align: left;
            margin: 0 auto;
            width: min(280px, 85%);
            padding-left: 24px;
            line-height: 1.6;
            font-size: 18px;
        }

        .skin-list {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        .skin-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 3px solid #fff;
            cursor: pointer;
            opacity: 0.78;
        }

        .skin-btn.selected {
            transform: scale(1.12);
            opacity: 1;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.35);
        }

        .primary-btn,
        .restart-btn {
            font-size: 22px;
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            background: #ff3d00;
            color: #fff;
            cursor: pointer;
        }

</head>

        canvas.width = window.innerWidth;

    function getLeaderboard() {
        const raw = localStorage.getItem(LEADERBOARD_KEY);
        if (!raw) return [];
        try {
            const parsed = JSON.parse(raw);
            return Array.isArray(parsed) ? parsed : [];
        } catch {
            return [];
        }
    }

    function saveLeaderboard(newScore) {
        if (!Number.isFinite(newScore) || newScore <= 0) return;
        const next = [...getLeaderboard(), newScore]
            .sort((a, b) => b - a)
            .slice(0, 5);
        localStorage.setItem(LEADERBOARD_KEY, JSON.stringify(next));
    }

    function renderLeaderboard() {
        const top = getLeaderboard();
        leaderboardList.innerHTML = "";
        for (let i = 0; i < 5; i += 1) {
            const li = document.createElement("li");
            li.textContent = top[i] ? `${top[i]} xal` : "---";
            leaderboardList.appendChild(li);
        }
    }

    function updateSkinButtons() {
        const buttons = skinList.querySelectorAll(".skin-btn");
        buttons.forEach((btn) => {
            btn.classList.toggle("selected", btn.dataset.color === selectedSkin);
        });
    }

    function updateHighScore() {
        if (score > highScore) {
            highScore = score;
            localStorage.setItem(HIGH_SCORE_KEY, String(highScore));

    function updateHud() {
        scoreText.textContent = `Xal: ${score} | Rekord: ${highScore}`;

            powerupText.textContent = `Power-up: ${label} (${sec}s)`;

            powerupText.textContent = "Power-up: yoxdur";

        if (type === "star") return "⭐ Ulduz";

    function initAudio() {
        if (audioCtx) return;
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;

        audioCtx = new AC();
        masterGain = audioCtx.createGain();
        musicGain = audioCtx.createGain();
        sfxGain = audioCtx.createGain();

        masterGain.gain.value = isMuted ? 0 : 1;
        musicGain.gain.value = 0.08;
        sfxGain.gain.value = 0.18;

        musicGain.connect(masterGain);
        sfxGain.connect(masterGain);
        masterGain.connect(audioCtx.destination);

        startMusic();
    }

    // Arxa fon musiqisi: sadə oscillator loop
    function startMusic() {
        if (!audioCtx || musicOscillators.length) return;

        const osc1 = audioCtx.createOscillator();
        const osc2 = audioCtx.createOscillator();
        const lfo = audioCtx.createOscillator();
        const lfoGain = audioCtx.createGain();

        osc1.type = "triangle";
        osc2.type = "sine";
        osc1.frequency.value = 196;
        osc2.frequency.value = 261.63;

        lfo.type = "sine";
        lfo.frequency.value = 0.12;
        lfoGain.gain.value = 24;

        lfo.connect(lfoGain);
        lfoGain.connect(osc2.frequency);

        osc1.connect(musicGain);
        osc2.connect(musicGain);

        const now = audioCtx.currentTime;
        osc1.start(now);
        osc2.start(now);
        lfo.start(now);

        musicOscillators = [osc1, osc2, lfo];

        const chord = [196, 220, 246.94, 261.63, 293.66];
        let i = 0;
        musicIntervalId = setInterval(() => {
            if (!audioCtx || state === GAME_STATE.MAIN_MENU) return;
            i = (i + 1) % chord.length;
            const t = audioCtx.currentTime;
            osc1.frequency.cancelScheduledValues(t);
            osc2.frequency.cancelScheduledValues(t);
            osc1.frequency.linearRampToValueAtTime(chord[i], t + 0.25);
            osc2.frequency.linearRampToValueAtTime(chord[(i + 2) % chord.length], t + 0.25);
        }, 900);
    }

    // Səs resurslarını düzgün sərbəst buraxmaq üçün təmizləmə
    function stopAudio() {
        if (musicIntervalId) {
            clearInterval(musicIntervalId);
            musicIntervalId = null;
        }
        musicOscillators.forEach((osc) => {
            try { osc.stop(); } catch { /* oscillator artıq dayanmış ola bilər */ }
        });
        musicOscillators = [];
    }

    // Səs effektləri
    function playSfx(type) {
        if (!audioCtx || isMuted) return;

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(sfxGain);

        const t = audioCtx.currentTime;
        if (type === "jump") {
            osc.type = "square";
            osc.frequency.setValueAtTime(420, t);
            osc.frequency.exponentialRampToValueAtTime(180, t + 0.15);
            gain.gain.setValueAtTime(0.12, t);
            gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
        } else if (type === "coin") {
            osc.type = "triangle";
            osc.frequency.setValueAtTime(760, t);
            osc.frequency.exponentialRampToValueAtTime(1120, t + 0.08);
            gain.gain.setValueAtTime(0.14, t);
            gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.1);
        } else if (type === "damage") {
            osc.type = "sawtooth";
            osc.frequency.setValueAtTime(160, t);
            osc.frequency.exponentialRampToValueAtTime(90, t + 0.22);
            gain.gain.setValueAtTime(0.16, t);
            gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.23);
        } else if (type === "enemy") {
            osc.type = "square";
            osc.frequency.setValueAtTime(280, t);
            osc.frequency.exponentialRampToValueAtTime(80, t + 0.2);
            gain.gain.setValueAtTime(0.14, t);
            gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.21);
        } else if (type === "power") {
            osc.type = "triangle";
            osc.frequency.setValueAtTime(330, t);
            osc.frequency.exponentialRampToValueAtTime(920, t + 0.2);
            gain.gain.setValueAtTime(0.15, t);
            gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.21);
        }

        osc.start(t);
        osc.stop(t + 0.25);
    }

    function toggleMute() {
        isMuted = !isMuted;
        muteBtn.textContent = isMuted ? "🔇" : "🔊";
        if (masterGain) {
            masterGain.gain.value = isMuted ? 0 : 1;
        }
    }

    function applyPowerUp(type) {
        activePowerUp = { type, time: POWER_UP_DURATIONS[type] };
        playSfx("power");
        updateHud();
    }

    function isInvincible() {
        return activePowerUp && activePowerUp.type === "star";
    }

    function getPlayerColor() {
        if (!activePowerUp) return selectedSkin;
        if (activePowerUp.type === "star") return "#FFD54F";
        if (activePowerUp.type === "speed") return "#00E5FF";
        return "#BA68C8";
    }

    function loadLevel(index) {
        currentLevelIndex = index;
        level = levels[currentLevelIndex];

        platforms = level.platforms.map((p) => ({
            ...p,
            baseX: p.x,
            baseY: p.y,
            phase: Math.random() * TWO_PI,
            deltaX: 0,
            deltaY: 0,
            crumbleStart: null,
            falling: false,
            fallSpeed: 0
        }));

        hazards = cloneRects(level.hazards);
        coins = level.coins.map((coin) => ({ ...coin, revealed: !coin.hidden }));
        enemies = level.enemies.map((enemy) => ({ ...enemy }));
        powerUps = level.powerUps.map((pow) => ({ ...pow }));
        exitDoor = { ...level.exitDoor };

        player.x = level.spawn.x;
        player.y = level.spawn.y;
        player.vx = 0;
        player.vy = 0;
        player.grounded = false;
        player.prevGrounded = false;
        player.squashX = 1;
        player.squashY = 1;
        player.currentPlatformType = "normal";

        activePowerUp = null;
        cameraX = 0;

        hideMessage();
        updateHud();
    }

    function startGame() {
        score = 0;
        lives = 3;
        levels = buildLevels();
        loadLevel(0);
        state = GAME_STATE.PLAYING;
        hud.classList.remove("hidden");
        mainMenu.classList.add("hidden");
    }

    function rebuildLevelAfterResize() {
        if (!canvas.width || !canvas.height) return;

        const oldState = state;
        const oldScore = score;
        const oldLives = lives;
        const oldIndex = currentLevelIndex;

        levels = buildLevels();

        if (oldState === GAME_STATE.PLAYING || oldState === GAME_STATE.PAUSED || oldState === GAME_STATE.LEVEL_COMPLETE) {
            loadLevel(Math.min(oldIndex, levels.length - 1));
            score = oldScore;
            lives = oldLives;
            state = oldState;
            updateHud();
        }
    }

    function addScore(points, x, y) {
        score += points;
        updateHighScore();
        floatingTexts.push({ x, y, text: `+${points}`, alpha: 1, vy: -0.45 });
        updateHud();
    }

    function makeDustBurst(x, y, color = "rgba(220,220,220,0.9)") {
        for (let i = 0; i < 10; i += 1) {
            const angle = (Math.PI * 2 * i) / 10 + Math.random() * 0.3;
            const speed = 1.4 + Math.random() * 1.7;
            particles.push({
                x,
                y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed - 0.4,
                life: 22 + Math.random() * 8,
                color,
                size: 2 + Math.random() * 2
            });
        }
    }

    function makeExplosion(x, y) {
        for (let i = 0; i < 22; i += 1) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 2 + Math.random() * 3.4;
            particles.push({
                x,
                y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                life: 28 + Math.random() * 14,
                color: i % 2 ? "#FF7043" : "#FFC107",
                size: 2 + Math.random() * 3
            });
        }
    }

    function loseLife() {
        if (state !== GAME_STATE.PLAYING || isInvincible()) {
            return;
        }

        lives -= 1;
        screenShakeTime = DAMAGE_SHAKE_MS;
        damageFlash = DAMAGE_FLASH_ALPHA;
        playSfx("damage");
        updateHud();

        if (lives <= 0) {
            updateHighScore();
            saveLeaderboard(score);
            state = GAME_STATE.GAME_OVER;
            showMessage("Game Over", `Xal: ${score} | Rekord: ${highScore}`, "Yenidən Başla", () => {
                startGame();
            });
            return;
        }

        // Can qaldıqda eyni səviyyənin başlanğıcına qaytar
        player.x = level.spawn.x;
        player.y = level.spawn.y;
        player.vx = 0;
        player.vy = 0;
        player.grounded = false;
        player.prevGrounded = false;
        cameraX = Math.max(0, player.x - canvas.width / 2);
    }

    function pauseGame() {
        if (state !== GAME_STATE.PLAYING) return;
        state = GAME_STATE.PAUSED;
        showMessage("Dayandırıldı", "Oyun dayandırıldı", "Davam et", () => {
            resumeGame();
        });
    }

    function resumeGame() {
        if (state !== GAME_STATE.PAUSED) return;
        state = GAME_STATE.PLAYING;
        hideMessage();
    }

    function checkAABBCircle(cx, cy, cr, rect) {
        const nearestX = Math.max(rect.x, Math.min(cx, rect.x + rect.w));
        const nearestY = Math.max(rect.y, Math.min(cy, rect.y + rect.h));
        const dx = cx - nearestX;
        const dy = cy - nearestY;
        return dx * dx + dy * dy <= cr * cr;
    }

    function updatePlatforms(deltaMs) {
        const deltaFactor = deltaMs / 16.67;

        platforms.forEach((p) => {
            const prevX = p.x;
            const prevY = p.y;

            if (p.type === "moving") {
                p.phase += 0.03 * (p.speed || 1) * deltaFactor;
                if (p.axis === "x") p.x = p.baseX + Math.sin(p.phase) * (p.range || 80);
                if (p.axis === "y") p.y = p.baseY + Math.sin(p.phase) * (p.range || 80);
            }

            if (p.falling) {
                p.fallSpeed += 0.25 * deltaFactor;
                p.y += p.fallSpeed;
            }

            p.deltaX = p.x - prevX;
            p.deltaY = p.y - prevY;
        });
    }

    function updatePlayerPhysics(deltaMs) {
        const speedBoost = activePowerUp && activePowerUp.type === "speed" ? 2 : 1;
        const moveSpeed = player.speed * speedBoost;

        if (inputs.left) player.vx = -moveSpeed;
        else if (inputs.right) player.vx = moveSpeed;
        else {
            const friction = player.currentPlatformType === "ice" ? 0.965 : 0.82;
            player.vx *= friction;
        }

        const prevVy = player.vy;
        const prevBottom = player.y + player.radius;

        const deltaFactor = deltaMs / 16.67;
        player.vy += player.gravity * deltaFactor;
        player.x += player.vx * deltaFactor;
        player.y += player.vy * deltaFactor;

        player.grounded = false;
        player.currentPlatformType = "normal";

        // Platforma üst səth toqquşması və xüsusi platforma davranışları
        platforms.forEach((p) => {
            if (p.falling && p.y > canvas.height + PLATFORM_CULLING_DISTANCE) return;

            const inHorizontalRange = player.x + player.radius > p.x && player.x - player.radius < p.x + p.w;
            const currentBottom = player.y + player.radius;

            if (inHorizontalRange && prevBottom <= p.y && currentBottom >= p.y) {
                player.y = p.y - player.radius;
                player.grounded = true;
                player.currentPlatformType = p.type;

                // Hərəkət edən platformada oyunçu da daşınsın
                player.x += p.deltaX;
                player.y += p.deltaY;

                if (p.type === "bouncy" && prevVy > 2) {
                    player.vy = player.jumpPower * BOUNCY_PLATFORM_BOOST;
                    player.grounded = false;
                    playSfx("jump");
                    makeDustBurst(player.x, player.y + player.radius, "rgba(255,193,7,0.85)");
                } else {
                    player.vy = 0;
                }

                if (p.type === "crumbling" && !p.crumbleStart) {
                    p.crumbleStart = performance.now();
                }
            }

            if (p.type === "crumbling" && p.crumbleStart && !p.falling) {
                if (performance.now() - p.crumbleStart >= CRUMBLE_DELAY_MS) {
                    p.falling = true;
                }
            }
        });

        // Dünya sərhədləri
        player.x = Math.max(player.radius, Math.min(level.worldWidth - player.radius, player.x));

        // Boşluğa düşərsə can itir
        if (player.y - player.radius > canvas.height + 280) {
            loseLife();
        }

        // Top üçün squash/stretch animasiyası
        if (player.grounded && !player.prevGrounded && Math.abs(prevVy) > 2) {
            player.squashX = 1.22;
            player.squashY = 0.82;
        } else if (!player.grounded && player.vy < -2) {
            player.squashX = 0.9;
            player.squashY = 1.14;
        }
        player.squashX += (1 - player.squashX) * 0.24;
        player.squashY += (1 - player.squashY) * 0.24;
        player.prevGrounded = player.grounded;
    }

    function updateCoins() {
        coins.forEach((coin) => {
            if (coin.collected) return;

            const dx = player.x - coin.x;
            const dy = player.y - coin.y;
            const dist = Math.hypot(dx, dy);

            if (coin.hidden && !coin.revealed && dist <= (coin.revealDistance || 170)) {
                coin.revealed = true;
            }

            if (activePowerUp && activePowerUp.type === "magnet" && dist < 185) {
                coin.revealed = true;
                coin.x += dx * MAGNET_PULL_STRENGTH;
                coin.y += dy * MAGNET_PULL_STRENGTH;
            }

            if (!coin.revealed) return;

            const r = player.radius + coin.r;
            if (dist <= r) {
                coin.collected = true;
                addScore(10, coin.x, coin.y);
                playSfx("coin");
            }
        });
    }

    function updatePowerUps(deltaMs) {
        if (activePowerUp) {
            activePowerUp.time -= deltaMs;
            if (activePowerUp.time <= 0) {
                activePowerUp = null;
            }
            updateHud();
        }

        powerUps.forEach((pow) => {
            if (pow.collected) return;

            const dist = Math.hypot(player.x - pow.x, player.y - pow.y);
            if (dist <= player.radius + pow.r) {
                pow.collected = true;
                applyPowerUp(pow.type);
            }
        });
    }

    function updateHazards() {
        if (isInvincible()) return;

        for (const hazard of hazards) {
            const hazardRect = {
                x: hazard.x,
                y: hazard.y - hazard.h,
                w: hazard.w,
                h: hazard.h
            };
            if (checkAABBCircle(player.x, player.y, player.radius, hazardRect)) {
                loseLife();
                break;
            }
        }
    }

    function updateEnemies() {
        for (const enemy of enemies) {
            if (!enemy.alive) continue;

            enemy.x += enemy.vx;
            if (enemy.x - enemy.r <= enemy.minX || enemy.x + enemy.r >= enemy.maxX) {
                enemy.vx *= -1;
            }

            const dx = player.x - enemy.x;
            const dy = player.y - enemy.y;
            const distance = Math.hypot(dx, dy);

            if (distance <= player.radius + enemy.r) {
                const stompFromTop = player.vy > 1 && player.y < enemy.y - enemy.r * 0.2;

                if (stompFromTop || isInvincible()) {
                    enemy.alive = false;
                    if (stompFromTop) {
                        player.vy = player.jumpPower * 0.62;
                    }
                    addScore(25, enemy.x, enemy.y - 14);
                    makeExplosion(enemy.x, enemy.y);
                    playSfx("enemy");
                } else {
                    loseLife();
                    break;
                }
            }
        }
    }

    function updateExitDoor() {
        if (!exitDoor) return;

        const insideDoor =
            player.x + player.radius > exitDoor.x &&
            player.x - player.radius < exitDoor.x + exitDoor.w &&
            player.y + player.radius > exitDoor.y &&
            player.y - player.radius < exitDoor.y + exitDoor.h;

        if (insideDoor && state === GAME_STATE.PLAYING) {
            if (currentLevelIndex < levels.length - 1) {
                state = GAME_STATE.LEVEL_COMPLETE;
                showMessage("Level Complete", `${level.name} tamamlandı`, "Next Level", () => {
                    loadLevel(currentLevelIndex + 1);
                    state = GAME_STATE.PLAYING;
                });
            } else {
                updateHighScore();
                saveLeaderboard(score);
                state = GAME_STATE.VICTORY;
                showMessage("Təbriklər!", `Xal: ${score} | Rekord: ${highScore}`, "Menyuya Qayıt", () => {
                    showMenu();
                });
            }
        }
    }

    function updateEffects(deltaMs) {
        for (let i = particles.length - 1; i >= 0; i -= 1) {
            const p = particles[i];
            p.x += p.vx * (deltaMs / 16.67);
            p.y += p.vy * (deltaMs / 16.67);
            p.vy += 0.03 * (deltaMs / 16.67);
            p.life -= deltaMs / 16.67;
            if (p.life <= 0) {
                particles.splice(i, 1);
            }
        }

        for (let i = floatingTexts.length - 1; i >= 0; i -= 1) {
            const t = floatingTexts[i];
            t.y += t.vy * (deltaMs / 16.67);
            t.alpha -= 0.018 * (deltaMs / 16.67);
            if (t.alpha <= 0) {
                floatingTexts.splice(i, 1);
            }
        }

        if (screenShakeTime > 0) {
            screenShakeTime -= deltaMs;
        }
        if (damageFlash > 0) {
            damageFlash -= deltaMs / 360;
        }
    }

    function handleJumpInput() {
        if (inputs.jump) {
            if (!jumpConsumed && player.grounded) {
                player.vy = player.jumpPower;
                player.grounded = false;
                jumpConsumed = true;
                playSfx("jump");
                makeDustBurst(player.x, player.y + player.radius);
            }
        } else {
            jumpConsumed = false;
        }
    }

    function getTheme() {
        return level?.theme || "day";
    }

    function drawGradientBackground() {
        const theme = getTheme();
        let top = "#87CEEB";
        let bottom = "#E0F7FA";

        if (theme === "evening") {
            top = "#FF8A65";
            bottom = "#6A1B9A";
        } else if (theme === "night") {
            top = "#0D1B3A";
            bottom = "#1B263B";
        }

        const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        grad.addColorStop(0, top);
        grad.addColorStop(1, bottom);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    // Paralaks buludlar
    function drawCloud(cloudX, cloudY, radius) {
        const theme = getTheme();
        ctx.fillStyle = theme === "night" ? "rgba(220,220,240,0.35)" : "rgba(255,255,255,0.85)";
        ctx.beginPath();
        ctx.arc(cloudX, cloudY, radius, 0, Math.PI * 2);
        ctx.arc(cloudX + radius * 0.9, cloudY + 2, radius * 0.8, 0, Math.PI * 2);
        ctx.arc(cloudX - radius * 0.9, cloudY + 4, radius * 0.72, 0, Math.PI * 2);
        ctx.fill();
    }

    // Paralaks dağlar
    function drawMountain(x, width, height) {
        const baseY = canvas.height - 50;
        ctx.beginPath();
        ctx.moveTo(x, baseY);
        ctx.lineTo(x + width / 2, baseY - height);
        ctx.lineTo(x + width, baseY);
        ctx.closePath();
        ctx.fill();
    }

    function drawParallaxBackground() {
        const cloudParallax = 0.25;
        level.clouds.forEach((cloud) => {
            const x = cloud.x - cameraX * cloudParallax;
            drawCloud(x, cloud.y, cloud.r);
        });

        const mountainParallax = 0.5;
        const theme = getTheme();
        ctx.fillStyle = theme === "night" ? "rgba(88, 112, 140, 0.42)" : "rgba(96, 125, 139, 0.45)";
        level.mountains.forEach((mountain) => {
            const x = mountain.x - cameraX * mountainParallax;
            drawMountain(x, mountain.w, mountain.h);
        });
    }

    function drawCoins() {
        coins.forEach((coin) => {
            if (coin.collected || !coin.revealed) return;
            ctx.beginPath();
            ctx.arc(coin.x, coin.y, coin.r, 0, Math.PI * 2);
            ctx.fillStyle = "#FFD700";
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = "#B8860B";
            ctx.stroke();
        });
    }

    function drawPowerUps() {
        ctx.font = "22px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        powerUps.forEach((pow) => {
            if (pow.collected) return;
            const icon = pow.type === "star" ? "⭐" : pow.type === "speed" ? "💨" : "🧲";
            ctx.fillStyle = "rgba(255,255,255,0.15)";
            ctx.beginPath();
            ctx.arc(pow.x, pow.y, pow.r + 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillText(icon, pow.x, pow.y + 1);
        });
    }

    function drawHazards() {
        ctx.fillStyle = "#37474F";
        hazards.forEach((h) => {
            ctx.beginPath();
            ctx.moveTo(h.x, h.y);
            ctx.lineTo(h.x + h.w / 2, h.y - h.h);
            ctx.lineTo(h.x + h.w, h.y);
            ctx.fill();
        });
    }

    function drawEnemies() {
        enemies.forEach((enemy) => {
            if (!enemy.alive) return;
            ctx.beginPath();
            ctx.arc(enemy.x, enemy.y, enemy.r, 0, Math.PI * 2);
            ctx.fillStyle = "#111";
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = "#333";
            ctx.stroke();
        });
    }

    function drawDoor() {
        if (!exitDoor) return;
        ctx.fillStyle = "#00BCD4";
        ctx.fillRect(exitDoor.x, exitDoor.y, exitDoor.w, exitDoor.h);
        ctx.fillStyle = "#B2EBF2";
        ctx.fillRect(exitDoor.x + 8, exitDoor.y + 8, exitDoor.w - 16, exitDoor.h - 16);

        ctx.fillStyle = "#795548";
        ctx.fillRect(exitDoor.x + exitDoor.w + 10, exitDoor.y - 70, 6, 70);
        ctx.fillStyle = "#FFEB3B";
        ctx.beginPath();
        ctx.moveTo(exitDoor.x + exitDoor.w + 16, exitDoor.y - 70);
        ctx.lineTo(exitDoor.x + exitDoor.w + 55, exitDoor.y - 52);
        ctx.lineTo(exitDoor.x + exitDoor.w + 16, exitDoor.y - 35);
        ctx.closePath();
        ctx.fill();
    }

    function drawPlatforms() {
        platforms.forEach((p) => {
            if (p.falling && p.y > canvas.height + PLATFORM_CULLING_DISTANCE) return;

            let base = "#4CAF50";
            let top = "#388E3C";

            if (p.type === "moving") {
                base = "#5C6BC0";
                top = "#3F51B5";
            } else if (p.type === "crumbling") {
                const nearBreak = p.crumbleStart && !p.falling;
                base = nearBreak ? "#EF5350" : "#8D6E63";
                top = nearBreak ? "#D32F2F" : "#6D4C41";
            } else if (p.type === "bouncy") {
                base = "#FFA726";
                top = "#F57C00";
            } else if (p.type === "ice") {
                base = "#81D4FA";
                top = "#4FC3F7";
            }

            const shakeX = p.type === "crumbling" && p.crumbleStart && !p.falling ? (Math.random() - 0.5) * 2 : 0;

            ctx.fillStyle = base;
            ctx.fillRect(p.x + shakeX, p.y, p.w, p.h);
            ctx.fillStyle = top;
            ctx.fillRect(p.x + shakeX, p.y, p.w, 5);
        });
    }

    function drawParticlesAndTexts() {
        particles.forEach((p) => {
            ctx.globalAlpha = Math.max(0, Math.min(1, p.life / 30));
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
        });

        ctx.globalAlpha = 1;
        ctx.font = "bold 18px Arial";
        ctx.textAlign = "center";
        floatingTexts.forEach((t) => {
            ctx.globalAlpha = Math.max(0, t.alpha);
            ctx.fillStyle = "#FFEB3B";
            ctx.fillText(t.text, t.x, t.y);
        });
        ctx.globalAlpha = 1;
    }

    function drawPlayer() {
        player.color = getPlayerColor();

        ctx.save();
        ctx.translate(player.x, player.y);
        ctx.scale(player.squashX, player.squashY);

        ctx.beginPath();
        ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
        ctx.fillStyle = player.color;
        ctx.fill();
        ctx.strokeStyle = "black";
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = "white";
        ctx.beginPath();
        ctx.arc(8, -5, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "black";
        ctx.beginPath();
        ctx.arc(10, -5, 2, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }

    function drawDamageFlash() {
        if (damageFlash <= 0) return;
        ctx.save();
        ctx.fillStyle = `rgba(255, 0, 0, ${Math.max(0, damageFlash)})`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.restore();
    }

    function draw() {
        drawGradientBackground();

        ctx.save();
        if (screenShakeTime > 0) {
            const power = Math.min(10, screenShakeTime / 45);
            const sx = (Math.random() - 0.5) * power;
            const sy = (Math.random() - 0.5) * power;
            ctx.translate(sx, sy);
        }

        if (level) {
            drawParallaxBackground();

            ctx.save();
            ctx.translate(-cameraX, 0);

            drawPlatforms();
            drawHazards();
            drawCoins();
            drawPowerUps();
            drawEnemies();
            drawDoor();
            drawParticlesAndTexts();
            drawPlayer();

            ctx.restore();
        }

        ctx.restore();
        drawDamageFlash();
    }

    function update(timestamp) {
        const deltaMs = Math.min(MAX_DELTA_MS, Math.max(MIN_DELTA_MS, timestamp - lastFrameTime));
        lastFrameTime = timestamp;

        if (state === GAME_STATE.PLAYING) {
            handleJumpInput();
            updatePlatforms(deltaMs);
            updatePlayerPhysics(deltaMs);
            updateCoins();
            updatePowerUps(deltaMs);
            updateHazards();
            updateEnemies();
            updateExitDoor();

            cameraX = Math.max(0, Math.min(level.worldWidth - canvas.width, player.x - canvas.width / 2));
        }

        updateEffects(deltaMs);
        draw();
        requestAnimationFrame(update);
    }

    // Touch kontrolları
    const setupInput = (id, key) => {
        const el = document.getElementById(id);
        const start = (e) => {
            e.preventDefault();
            inputs[key] = true;
            initAudio();
            if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
        };
        const end = (e) => {
            e.preventDefault();
            inputs[key] = false;
        };

        el.addEventListener("touchstart", start, { passive: false });
        el.addEventListener("touchend", end, { passive: false });
        el.addEventListener("touchcancel", end, { passive: false });
    };

    setupInput("leftBtn", "left");
    setupInput("rightBtn", "right");
    setupInput("jumpBtn", "jump");

    // Klaviatura kontrolları (mövcud sxem saxlanılır)
    window.addEventListener("keydown", (e) => {
        if (["ArrowLeft", "ArrowRight", "ArrowUp", "Space", "KeyP"].includes(e.code)) {
            e.preventDefault();
        }

        initAudio();
        if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();

        if (e.code === "ArrowLeft") inputs.left = true;
        if (e.code === "ArrowRight") inputs.right = true;
        if (e.code === "Space" || e.code === "ArrowUp") inputs.jump = true;

        if (e.code === "KeyP") {
            if (state === GAME_STATE.PLAYING) pauseGame();
            else if (state === GAME_STATE.PAUSED) resumeGame();
        }
    });

    window.addEventListener("keyup", (e) => {
        if (e.code === "ArrowLeft") inputs.left = false;
        if (e.code === "ArrowRight") inputs.right = false;
        if (e.code === "Space" || e.code === "ArrowUp") inputs.jump = false;
    });

    pauseBtn.addEventListener("click", () => {
        if (state === GAME_STATE.PLAYING) pauseGame();
        else if (state === GAME_STATE.PAUSED) resumeGame();
    });

    muteBtn.addEventListener("click", () => {
        initAudio();
        toggleMute();
    });

    skinList.addEventListener("click", (e) => {
        const btn = e.target.closest(".skin-btn");
        if (!btn) return;
        selectedSkin = btn.dataset.color;
        localStorage.setItem(SKIN_KEY, selectedSkin);
        updateSkinButtons();
    });

    playBtn.addEventListener("click", () => {
        initAudio();
        if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
        startGame();
    });

    window.addEventListener("beforeunload", stopAudio);

    // İlkin yükləmə
    resize();
    levels = buildLevels();
    showMenu();
    updateHud();
    requestAnimationFrame((t) => {
        lastFrameTime = t;
        update(t);
    });
</script>
</body>
</html>
